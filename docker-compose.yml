# =============================================================================
# docker-compose.yml — Entorno de desarrollo local
# Marketplace TCG con Bóveda (Pokémon, México)  ·  Propiedad: devops
# =============================================================================
# Levanta la INFRAESTRUCTURA que el proyecto necesita en local:
#   - PostgreSQL 16   (base de datos relacional)
#   - Redis 7         (cache, colas BullMQ, rate-limit del free tier)
#   - MinIO           (object storage S3-compatible para fotos)
#   - createbuckets   (init container: crea el bucket de MinIO y sale)
#
# Los servicios de aplicación (backend NestJS / frontend Next.js) están
# DEFINIDOS pero bajo el perfil "apps" y quedan APAGADOS por defecto, porque
# su código aún no existe. Ver "PERFIL apps" abajo.
#
# Uso rápido:
#   docker compose up -d              # solo infraestructura (postgres/redis/minio)
#   docker compose --profile apps up  # + backend y frontend (cuando exista el código)
#   docker compose down               # apaga (conserva volúmenes/datos)
#   docker compose down -v            # apaga y BORRA los datos (reset total)
#
# Todas las credenciales salen de `.env` (copia de `.env.example`). Con los
# valores por defecto de `.env.example` esto arranca sin tocar nada.
# =============================================================================

name: tcg-marketplace

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — base de datos principal
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcg_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-tcg_marketplace}
    # SEC-M4: bind SOLO a localhost. La base nunca se publica en 0.0.0.0 (LAN).
    # El backend en el perfil "apps" la alcanza por la red de compose (host
    # 'postgres'), no por este puerto; este mapeo es para psql/prisma desde tu host.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcg} -d ${POSTGRES_DB:-tcg_marketplace}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis 7 — cache, colas BullMQ (price-sync, fx-refresh, sweeps) y rate-limit
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # SEC-M4: bind SOLO a localhost (no exponer Redis a la LAN).
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # MinIO — object storage S3-compatible (fotos de bóveda/verificación/disputa)
  #   API:     http://localhost:9000
  #   Consola: http://localhost:9001  (login con MINIO_ROOT_USER/PASSWORD)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_local_dev}
    # SEC-M4: bind SOLO a localhost (API + consola no expuestas a la LAN).
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # createbuckets — init container: crea el bucket y sale (no queda corriendo).
  # SEC-A5 + v1.2.1: bucket 100% PRIVADO. Su único contenido es el prefijo
  # kyc_ine/ (INE del buylist, INE/PII) que NUNCA es de lectura pública: se sirve
  # por presigned GET (backend). Ya NO hay inventory_photo/ (catálogo público, sin
  # CDN) ni dispute_claim/ (la evidencia de disputa va por correo). 'set none'
  # garantiza que un bucket preexistente (de una corrida vieja con lectura pública)
  # quede reprivatizado. En prod (R2/S3) el bucket va 100% privado, solo kyc_ine/.
  # ---------------------------------------------------------------------------
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin_local_dev} &&
      mc mb --ignore-existing local/${S3_BUCKET:-tcg-photos} &&
      mc anonymous set none local/${S3_BUCKET:-tcg-photos} &&
      mc ilm rule add --expire-days ${INE_RETENTION_DAYS:-180} --prefix 'kyc_ine/' local/${S3_BUCKET:-tcg-photos} || mc ilm add --expiry-days ${INE_RETENTION_DAYS:-180} --prefix 'kyc_ine/' local/${S3_BUCKET:-tcg-photos} || echo 'aviso: no se pudo fijar lifecycle kyc_ine/ (mc sin soporte ilm); backend sigue borrando por retencion.' &&
      echo 'Bucket ${S3_BUCKET:-tcg-photos} listo: 100% privado; solo kyc_ine/ (presigned GET); lifecycle kyc_ine/ expira a ${INE_RETENTION_DAYS:-180} dias.' &&
      exit 0
      "
    restart: "no"

  # ===========================================================================
  # PERFIL apps — Backend y Frontend (APAGADOS por defecto)
  # ---------------------------------------------------------------------------
  # Estos servicios NO arrancan con `docker compose up` normal: requieren
  # `docker compose --profile apps up` Y que exista el código en backend/ y
  # frontend/ (hoy esas carpetas aún no existen; las crean los roles backend y
  # frontend). Hasta entonces, en desarrollo se levantan a mano fuera de Docker:
  #   cd backend  && npm install && npm run start:dev
  #   cd frontend && npm install && npm run dev
  # apuntando a la infraestructura de arriba vía `.env`.
  #
  # Los Dockerfiles viven en la raíz (Dockerfile.backend / Dockerfile.frontend)
  # para respetar la propiedad de archivos de CLAUDE.md (devops no escribe
  # dentro de backend/ ni frontend/).
  # ===========================================================================

  backend:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Dentro de la red de compose los hosts son los nombres de servicio:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tcg}:${POSTGRES_PASSWORD:-tcg_local_dev_password}@postgres:5432/${POSTGRES_DB:-tcg_marketplace}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-tcg-photos}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin_local_dev}
      # v1.2.1: sin S3_PUBLIC_BASE_URL — el bucket es 100% privado (solo kyc_ine/, presigned GET).
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Tope de bytes del upload de INE (kyc_ine). Opcional: sin valor, backend usa 10 MiB.
      KYC_UPLOAD_MAX_BYTES: ${KYC_UPLOAD_MAX_BYTES:-10485760}
      # Retención de INE del KYC (kyc_ine/). El backend borra; el bucket expira
      # como capa extra (ver createbuckets). Mantener igual al dial M10 si aplica.
      INE_RETENTION_DAYS: ${INE_RETENTION_DAYS:-180}
      # Endurecimiento PII: cifrado en reposo (CLABE/RFC) + blind index (CLABE).
      # En local pueden ir vacías (greenfield); en no-local son obligatorias y el
      # backend debe abortar si faltan. En prod: KMS / secret manager.
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      PII_HMAC_KEY: ${PII_HMAC_KEY:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # Login con Google (v1.2): mismo OAuth Client ID que el front (NEXT_PUBLIC_GOOGLE_CLIENT_ID).
      # Si va vacío, el backend rechaza el login con Google (email/password sigue OK).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Disputas (v1.2): correo de contacto de evidencia. Vacío ⇒ el backend cae a su
      # default de código (P-21: `soporte@tcghunt.mx`, backend/src/modules/disputes).
      DISPUTE_EVIDENCE_CONTACT: ${DISPUTE_EVIDENCE_CONTACT:-}
      POKEMONTCG_IO_API_KEY: ${POKEMONTCG_IO_API_KEY}
      # ⚠️ CREDENCIAL DEL PROVEEDOR DE PAGA — desde v1.51 (M-46) es lo que separa a
      # este stack de una factura. Con `grading_hook_enabled = on` (UN solo dial: el
      # mismo `PUT` publica y AUTORIZA GASTO), cada tick de `price-ingest` pide datos
      # a PokemonPriceTracker a 2 créditos/carta. Sin llave, el proveedor sale con
      # `warn` ANTES de la primera petición: cero peticiones, cero escrituras.
      #
      # El `:-` NO es cosmético. Antes decía `${POKEMONPRICETRACKER_API_KEY}` SIN
      # default, y eso significaba: «toma la del `.env` de quien levante el stack, y
      # si no hay, quédate vacía con un warning de compose». En CI quedaba vacía POR
      # ACCIDENTE, no por diseño; en la máquina de alguien con la llave real, una
      # corrida de E2E —que enciende el dial en cada arranque— habría empezado a
      # gastar. Con `:-` la ausencia es un DEFAULT DECLARADO: vacío salvo que el
      # operador la exporte a propósito. Ver DEVOPS_NOTES §32.12 y ARCHITECTURE
      # §4.38(r.6.1).
      POKEMONPRICETRACKER_API_KEY: ${POKEMONPRICETRACKER_API_KEY:-}
      # Sonda de SOLO LECTURA del ingest de graded (§4.38h.1-quater): con la llave
      # presente, `on` hace que el barrido PREGUNTE al proveedor y NO ESCRIBA nada.
      # Es la segunda forma admitida de incapacitar un entorno (§4.38r.6.1). NO es un
      # dial del producto: solo QUITA capacidad de escribir, nunca la da.
      POKEMONPRICETRACKER_GRADED_PROBE: ${POKEMONPRICETRACKER_GRADED_PROBE:-}
      POKETRACE_API_KEY: ${POKETRACE_API_KEY}
      FX_SOURCE: ${FX_SOURCE:-banxico}
      FX_API_KEY: ${FX_API_KEY:-}
      # Token de la API SIE de Banxico (FX USD->MXN automático). Si va vacío, el
      # backend cae a override manual / último FxRate (no se rompe).
      BANXICO_SIE_TOKEN: ${BANXICO_SIE_TOKEN:-}
      # Cuentas sembradas por seed.sh. SEC-C1: define contraseñas fuertes en .env;
      # backend debe leerlas como obligatorias (hoy aún cae a defaults débiles).
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_OPERATOR_EMAIL: ${SEED_OPERATOR_EMAIL:-}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-es}
    ports:
      - "3001:3001"

  frontend:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: runtime
      args:
        # Variables NEXT_PUBLIC_* se hornean en build-time (se exponen al browser).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001/api/v1}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-es}
        # false = el cliente llama al backend real (no fixtures). Debe hornearse
        # en build-time; por eso va como build arg, no como env de runtime.
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
        # Login con Google (v1.2): mismo OAuth Client ID que el backend (GOOGLE_CLIENT_ID).
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
