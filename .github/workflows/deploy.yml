# =============================================================================
# deploy.yml — Despliegue CD  ·  Propiedad: devops
# TCG Vault MX — Marketplace TCG con Bóveda (Pokémon, México)
# =============================================================================
# Topología CONFIRMADA:
#   - Frontend Next.js  -> Vercel   (secrets VERCEL_*)
#   - Backend NestJS    -> Railway  (Dockerfile.backend; migrate deploy al arrancar)
#   - PostgreSQL 16 + Redis 7 -> add-ons de Railway (inyectan DATABASE_URL/REDIS_URL)
#   - Fotos             -> Cloudflare R2 (bucket privado; presigned PUT/GET)
#
# Flujo:
#   0) GATE: solo corre si CI terminó VERDE (workflow_run) o disparo manual.
#   1) preflight: verifica que TODOS los secrets de deploy existan. Si falta
#      alguno, el pipeline FALLA con la lista exacta (no despliega a medias).
#   2) Deploy a STAGING: backend->Railway(staging) + frontend->Vercel(preview).
#      El backend corre `prisma migrate deploy` al arrancar (Dockerfile CMD).
#   3) GATES de promoción (deben pasar los TRES para ir a prod):
#        a) DAST contra STAGING (ZAP baseline + nuclei).
#        b) E2E REAL (e2e-real.yml, stack real mocks=false, endpoints reales).
#        c) SAST en PR (branch protection) ya exigido antes del merge.
#   4) SOLO si DAST no tiene críticos Y el E2E real pasó -> promoción a PRODUCCIÓN,
#      protegida por el GitHub Environment "production" (required reviewers).
#
# Rama de release: `main` (recomendada). Para que el trigger workflow_run
# funcione, este archivo debe estar en la rama por defecto del repo. Ajusta
# `branches:` abajo si usas otra rama de release.
#
# Migración + seed: `migrate deploy` es automático en cada arranque del backend
# (idempotente). El `seed` inicial (diales M10 + super_admin + operador) se corre
# UNA sola vez a mano tras el primer deploy (ver DEVOPS_NOTES §11.D).
# =============================================================================

name: Deploy (staging -> prod)

# -----------------------------------------------------------------------------
# CD por GitHub Actions DESACTIVADO por defecto (solo `workflow_dispatch`).
# Los deploys reales van por integraciones NATIVAS Vercel/Railway (push-to-deploy
# de cada plataforma), así que este workflow es REDUNDANTE para el flujo normal.
# Antes se disparaba con `workflow_run` de CI en `main` y FALLABA en `preflight`
# por falta de los 6 GitHub Secrets de deploy en CADA push (rojo espurio). Ahora:
#   - NO corre automáticamente (se quitó el trigger `workflow_run`).
#   - Solo se dispara a mano (`workflow_dispatch`); y aun así el job `secrets-gate`
#     lo SALTA limpiamente si faltan los secrets (no falla — deja un ::notice::).
# REACTIVAR el CD por Actions: (1) carga los 6 GitHub Secrets (RAILWAY_TOKEN,
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, STAGING_BASE_URL, PROD_BASE_URL —
# ver DEVOPS_NOTES §11.D); (2) opcional: para CD en cada release, descomenta el
# bloque `workflow_run` de abajo. Con los secrets presentes, `secrets-gate` deja
# pasar el pipeline y `preflight` valida como antes.
# -----------------------------------------------------------------------------
on:
  # Disparo manual (primer deploy, re-deploy puntual, o promoción a prod).
  workflow_dispatch:
    inputs:
      promote_to_prod:
        description: "Promover a producción si el DAST de staging pasa"
        type: boolean
        default: false
  # CD automático por release (OPCIONAL): descomenta y carga los 6 secrets.
  # workflow_run:
  #   workflows: ["CI"]
  #   types: [completed]
  #   branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Nombre EXACTO del servicio backend en Railway (créalo con este nombre).
  RAILWAY_BACKEND_SERVICE: backend

jobs:
  # ---------------------------------------------------------------------------
  # GATE 0: existencia de los secrets de deploy. Si faltan, el pipeline se SALTA
  # limpiamente (los jobs dependientes quedan skipped = neutral, NO failure) en
  # vez de romper en `preflight`. Así este CD redundante no ensucia el pipeline
  # cuando no hay credenciales. `preflight` (abajo) sigue existiendo como doble
  # verificación para el caso en que SÍ estén cargados.
  # ---------------------------------------------------------------------------
  secrets-gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          MISSING=""
          for VAR in RAILWAY_TOKEN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID STAGING_BASE_URL PROD_BASE_URL; do
            if [ -z "${!VAR}" ]; then MISSING="$MISSING $VAR"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CD por Actions desactivado::Faltan GitHub Secrets de deploy:$MISSING. Los deploys reales van por integraciones nativas Vercel/Railway; este CD por Actions queda SALTADO (no es un fallo). Para activarlo, carga los 6 secrets (DEVOPS_NOTES §11.D) y vuelve a disparar."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Secrets de deploy presentes: el CD por Actions continúa."
          fi

  # ---------------------------------------------------------------------------
  # GATE: CI verde. Con workflow_run, exige conclusion == success. En disparo
  # manual (workflow_dispatch) se asume que el operador ya verificó CI/E2E.
  # (Refuerza además con branch protection: ci-ok, sast-ok y e2e como
  #  required status checks de la rama de release — ver DEVOPS_NOTES §5/§14.)
  # Solo corre si `secrets-gate` marcó ready == 'true'.
  # ---------------------------------------------------------------------------
  ci-ok:
    needs: [secrets-gate]
    if: needs.secrets-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que CI terminó verde
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            echo "CI (workflow_run) conclusion=$CONCLUSION"
            if [ "$CONCLUSION" != "success" ]; then
              echo "::error::CI no terminó en 'success' (fue '$CONCLUSION'). Se ABORTA el deploy."
              exit 1
            fi
          else
            echo "Disparo manual (workflow_dispatch): se asume CI/E2E verdes ya verificados."
          fi

  # ---------------------------------------------------------------------------
  # preflight: confirma que existen TODOS los secrets de deploy. Si falta alguno,
  # FALLA con la lista exacta (no continúa, no despliega a medias).
  # ---------------------------------------------------------------------------
  preflight:
    needs: [ci-ok]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secrets de deploy (GitHub Secrets)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          MISSING=""
          for VAR in RAILWAY_TOKEN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID STAGING_BASE_URL PROD_BASE_URL; do
            if [ -z "${!VAR}" ]; then MISSING="$MISSING $VAR"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Faltan GitHub Secrets de deploy:$MISSING"
            echo "::error::Cárgalos en Settings > Secrets and variables > Actions (ver DEVOPS_NOTES §11.C). El deploy NO continúa."
            exit 1
          fi
          echo "Todos los secrets de deploy presentes. Continúa el pipeline."

  # ---------------------------------------------------------------------------
  # GATE E2E REAL: stack completo (mocks=false) contra endpoints reales. Es el
  # gate que hace que "verde" signifique "funciona de verdad" (arreglo Paso 5).
  # Reutiliza e2e-real.yml (workflow_call); spin-up de su propio stack efímero,
  # no depende de los deploys de staging. Debe pasar ANTES de promover a prod.
  # REQUISITO: runner-harness con navegadores Playwright preinstalados (ver
  # e2e-real.yml / DEVOPS_NOTES §5.1). `secrets: inherit` pasa STRIPE_TEST_*.
  # ---------------------------------------------------------------------------
  e2e-real:
    needs: [preflight]
    uses: ./.github/workflows/e2e-real.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # STAGING — Backend a Railway (environment staging).
  # `railway up` sube el repo y construye con Dockerfile.backend (ver railway.json).
  # Al arrancar, el contenedor corre `prisma migrate deploy` (Dockerfile CMD).
  # ---------------------------------------------------------------------------
  deploy-staging-backend:
    needs: [preflight]
    runs-on: ubuntu-latest
    environment:
      # NOTA: `environment.url` NO admite el contexto `secrets` (solo env/github/
      # inputs/needs/vars…). Ponerlo ahí hace que GitHub rechace el workflow al
      # arrancar (startup_failure: 0 jobs). El link de despliegue es cosmético;
      # se omite. El objetivo de STAGING_BASE_URL es el DAST (job dast-staging).
      name: staging
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Railway CLI
        run: npm i -g @railway/cli@latest
      - name: Deploy backend a Railway (staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          : "${RAILWAY_TOKEN:?falta RAILWAY_TOKEN}"
          echo "Desplegando servicio '$RAILWAY_BACKEND_SERVICE' a Railway (staging)..."
          railway up --service "$RAILWAY_BACKEND_SERVICE" --environment staging --ci
      # Nota: el SEED inicial (diales M10 + super_admin + operador) NO se corre
      # aquí; es una acción de UNA sola vez tras el primer deploy:
      #   railway run --service backend --environment staging npm run seed
      # (ver DEVOPS_NOTES §11.D). En staging, el harness usa datos SINTÉTICOS.

  # ---------------------------------------------------------------------------
  # STAGING — Frontend a Vercel (preview = staging).
  # Las NEXT_PUBLIC_* viven en el proyecto de Vercel (env "Preview"); `vercel pull`
  # las trae y `vercel build` las hornea. Debe incluir NEXT_PUBLIC_USE_MOCKS=false.
  # ---------------------------------------------------------------------------
  deploy-staging-frontend:
    needs: [preflight]
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Vercel CLI
        run: npm i -g vercel@latest
      - name: Deploy frontend a Vercel (preview/staging)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_TOKEN:?falta VERCEL_TOKEN}"
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          DEPLOY_URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Frontend staging desplegado: $DEPLOY_URL"
          echo "STAGING_DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
      # El dominio estable de staging (alias) lo apunta Vercel al proyecto; el
      # DAST usa STAGING_BASE_URL (dominio estable), no la URL efímera del deploy.

  # ---------------------------------------------------------------------------
  # DAST contra STAGING: ZAP baseline + nuclei. GATE de promoción a prod.
  # Necesita STAGING_BASE_URL en vivo (el frontend/back de staging ya desplegados).
  # ---------------------------------------------------------------------------
  dast-staging:
    needs: [deploy-staging-backend, deploy-staging-frontend]
    runs-on: ubuntu-latest
    outputs:
      critical: ${{ steps.gate.outputs.critical }}
    env:
      TARGET_URL: ${{ secrets.STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Guardia anti-producción
        run: |
          : "${TARGET_URL:?falta STAGING_BASE_URL}"
          echo "DAST target (staging): $TARGET_URL"
      - name: ZAP baseline contra staging
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.TARGET_URL }}
          rules_file_name: security/zap/baseline.conf
          # -I: no falla por WARN; los FAIL de baseline.conf marcan el gate.
          cmd_options: "-I"
          fail_action: true
      - name: nuclei contra staging
        run: |
          mkdir -p security/reports
          docker run --rm -v "${{ github.workspace }}/security:/sec" \
            projectdiscovery/nuclei:latest \
            -u "$TARGET_URL" \
            -tags "$(grep -vE '^\s*#|^\s*$' security/nuclei/templates.txt | paste -sd, -)" \
            -severity high,critical \
            -rate-limit 50 \
            -jsonl -o /sec/reports/nuclei.jsonl || true
      - id: gate
        name: Evaluar hallazgos críticos
        run: |
          CRIT=false
          if [ -f security/reports/nuclei.jsonl ] && grep -Eq '"severity":"(high|critical)"' security/reports/nuclei.jsonl; then
            CRIT=true
          fi
          echo "critical=$CRIT" >> "$GITHUB_OUTPUT"
          if [ "$CRIT" = "true" ]; then
            echo "::error::DAST encontró hallazgos críticos/altos. Se BLOQUEA la promoción a producción."
            exit 1
          fi
          echo "DAST sin hallazgos críticos/altos: apto para promover."

  # ---------------------------------------------------------------------------
  # PRODUCCIÓN — Backend a Railway (environment production).
  # Requiere aprobación manual del Environment "production" (required reviewers).
  # Solo corre si el DAST de staging pasó Y (en disparo manual) promote_to_prod.
  # ---------------------------------------------------------------------------
  promote-production-backend:
    needs: [dast-staging, e2e-real]
    if: >-
      needs.dast-staging.outputs.critical == 'false' &&
      needs.e2e-real.result == 'success' &&
      (github.event_name == 'workflow_run' || inputs.promote_to_prod == true)
    runs-on: ubuntu-latest
    environment:
      # protégelo con "required reviewers" en GitHub. Sin `url:` a propósito:
      # `environment.url` no admite el contexto `secrets` (causaba startup_failure).
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Recordatorio de snapshot de DB (rollback)
        run: |
          echo "::notice::Antes de promover: toma snapshot / point-in-time de la DB de PROD."
          echo "::notice::Railway Postgres: Backups > Create backup (o point-in-time). Ver DEVOPS_NOTES §7."
      - name: Instalar Railway CLI
        run: npm i -g @railway/cli@latest
      - name: Deploy backend a Railway (production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          : "${RAILWAY_TOKEN:?falta RAILWAY_TOKEN}"
          echo "Desplegando servicio '$RAILWAY_BACKEND_SERVICE' a Railway (production)..."
          railway up --service "$RAILWAY_BACKEND_SERVICE" --environment production --ci
          # `prisma migrate deploy` corre en el arranque del contenedor (Dockerfile CMD).

  # ---------------------------------------------------------------------------
  # PRODUCCIÓN — Frontend a Vercel (--prod).
  # ---------------------------------------------------------------------------
  promote-production-frontend:
    needs: [dast-staging, e2e-real, promote-production-backend]
    if: >-
      needs.dast-staging.outputs.critical == 'false' &&
      needs.e2e-real.result == 'success' &&
      (github.event_name == 'workflow_run' || inputs.promote_to_prod == true)
    runs-on: ubuntu-latest
    environment:
      # Sin `url:` a propósito: `environment.url` no admite `secrets` (startup_failure).
      name: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Vercel CLI
        run: npm i -g vercel@latest
      - name: Deploy frontend a Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_TOKEN:?falta VERCEL_TOKEN}"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Frontend producción desplegado: $DEPLOY_URL"
