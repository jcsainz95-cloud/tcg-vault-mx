# =============================================================================
# deploy.yml — Despliegue CD  ·  Propiedad: devops
# TCG Vault MX — Marketplace TCG con Bóveda (Pokémon, México)
# =============================================================================
# Topología CONFIRMADA:
#   - Frontend Next.js  -> Vercel   (secrets VERCEL_*)
#   - Backend NestJS    -> Railway  (Dockerfile.backend; migrate deploy al arrancar)
#   - PostgreSQL 16 + Redis 7 -> add-ons de Railway (inyectan DATABASE_URL/REDIS_URL)
#   - Fotos             -> Cloudflare R2 (bucket privado; presigned PUT/GET)
#
# Flujo:
#   0) GATE: solo corre si CI terminó VERDE (workflow_run) o disparo manual.
#   1) preflight: verifica que TODOS los secrets de deploy existan. Si falta
#      alguno, el pipeline FALLA con la lista exacta (no despliega a medias).
#   2) Deploy a STAGING: backend->Railway(staging) + frontend->Vercel(preview).
#      El backend corre `prisma migrate deploy` al arrancar (Dockerfile CMD).
#   3) GATES de promoción (deben pasar los TRES para ir a prod):
#        a) DAST contra STAGING (ZAP baseline + nuclei).
#        b) E2E REAL (e2e-real.yml, stack real mocks=false, endpoints reales).
#        c) SAST en PR (branch protection) ya exigido antes del merge.
#   4) SOLO si DAST no tiene críticos Y el E2E real pasó -> promoción a PRODUCCIÓN,
#      protegida por el GitHub Environment "production" (required reviewers).
#
# Rama de release: `main` (recomendada). Para que el trigger workflow_run
# funcione, este archivo debe estar en la rama por defecto del repo. Ajusta
# `branches:` abajo si usas otra rama de release.
#
# Migración + seed: `migrate deploy` es automático en cada arranque del backend
# (idempotente). El `seed` inicial (diales M10 + super_admin + operador) se corre
# UNA sola vez a mano tras el primer deploy (ver DEVOPS_NOTES §11.D).
# =============================================================================

name: Deploy (staging -> prod)

# =============================================================================
# ⚠️ TRES GATES DE ESTE ARCHIVO ESTÁN **INERTES** (P-77, 2026-09-10)
# =============================================================================
# Este workflow no corre: solo `workflow_dispatch`, y aun así `secrets-gate` lo
# salta si faltan secrets. Los deploys reales van por las integraciones NATIVAS
# de Vercel/Railway (push-to-deploy). Eso se mantiene: **NO se reactiva el CD**.
#
# Pero de eso se sigue algo que hasta hoy no estaba escrito, y por no estarlo se
# contaba como cobertura: los gates que viven aquí dentro **no gatean nada**.
# Cuelgan de un pipeline apagado que además apunta a un entorno inexistente —
# el dueño nunca tuvo staging, solo producción.
#
#   | Gate (aquí)                | Estado  | Dónde vive el que SÍ corre                    |
#   |----------------------------|---------|-----------------------------------------------|
#   | `staging-serves-head`      | INERTE  | e2e-real.yml (nightly) y security-dast.yml:    |
#   |  (procedencia SEC-OPS-1)   |         | `assert-serving-head.sh` contra el stack       |
#   |                            |         | efímero, en cada corrida.                      |
#   | `staging-provider-parity`  | INERTE  | security-dast.yml y e2e-real.yml:              |
#   |  (`I-PP5` / `D-PP-2`)      |         | `price-provider-parity.sh --assert` contra el  |
#   |                            |         | stack efímero. **Sin secrets**: el admin lo    |
#   |                            |         | crea el seed sintético.                        |
#   | `dast-staging`             | INERTE  | security-dast.yml: ZAP+nuclei contra el stack  |
#   |  (ZAP + nuclei)            |         | efímero, semanal, con autoprueba del candado.  |
#
# POR QUÉ NO SE BORRAN: son el esqueleto del día que exista un staging
# desplegado, y esa decisión es del dueño, no de devops. Lo que NO puede pasar
# es que alguien los cite como cobertura activa — que es exactamente lo que
# pasó durante meses. Por eso quedan MARCADOS aquí y `scripts/check-dast-gate-live.sh`
# (job `dast-gate-live` de ci.yml) comprueba en cada push que la marca sigue puesta.
#
# ⛔ SI ALGÚN DÍA SE REACTIVA ESTE CD: los tres dejan de ser inertes solo cuando
#    exista un staging DESPLEGADO y sus secrets estén cargados. Reactivar el
#    workflow sin eso devuelve el pipeline al estado de P-77 (gates en verde que
#    no miraron nada). Detalle y decisión completa: DEVOPS_NOTES §44.6.
# =============================================================================

# -----------------------------------------------------------------------------
# CD por GitHub Actions DESACTIVADO por defecto (solo `workflow_dispatch`).
# Los deploys reales van por integraciones NATIVAS Vercel/Railway (push-to-deploy
# de cada plataforma), así que este workflow es REDUNDANTE para el flujo normal.
# Antes se disparaba con `workflow_run` de CI en `main` y FALLABA en `preflight`
# por falta de los 6 GitHub Secrets de deploy en CADA push (rojo espurio). Ahora:
#   - NO corre automáticamente (se quitó el trigger `workflow_run`).
#   - Solo se dispara a mano (`workflow_dispatch`); y aun así el job `secrets-gate`
#     lo SALTA limpiamente si faltan los secrets (no falla — deja un ::notice::).
# REACTIVAR el CD por Actions: (1) carga los 6 GitHub Secrets (RAILWAY_TOKEN,
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, STAGING_BASE_URL, PROD_BASE_URL —
# ver DEVOPS_NOTES §11.D); (2) opcional: para CD en cada release, descomenta el
# bloque `workflow_run` de abajo. Con los secrets presentes, `secrets-gate` deja
# pasar el pipeline y `preflight` valida como antes.
# -----------------------------------------------------------------------------
on:
  # Disparo manual (primer deploy, re-deploy puntual, o promoción a prod).
  workflow_dispatch:
    inputs:
      promote_to_prod:
        description: "Promover a producción si el DAST de staging pasa"
        type: boolean
        default: false
  # CD automático por release (OPCIONAL): descomenta y carga los 6 secrets.
  # workflow_run:
  #   workflows: ["CI"]
  #   types: [completed]
  #   branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Nombre EXACTO del servicio backend en Railway (créalo con este nombre).
  RAILWAY_BACKEND_SERVICE: backend

jobs:
  # ---------------------------------------------------------------------------
  # GATE 0: existencia de los secrets de deploy. Si faltan, el pipeline se SALTA
  # limpiamente (los jobs dependientes quedan skipped = neutral, NO failure) en
  # vez de romper en `preflight`. Así este CD redundante no ensucia el pipeline
  # cuando no hay credenciales. `preflight` (abajo) sigue existiendo como doble
  # verificación para el caso en que SÍ estén cargados.
  # ---------------------------------------------------------------------------
  secrets-gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          MISSING=""
          for VAR in RAILWAY_TOKEN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID STAGING_BASE_URL PROD_BASE_URL; do
            if [ -z "${!VAR}" ]; then MISSING="$MISSING $VAR"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CD por Actions desactivado::Faltan GitHub Secrets de deploy:$MISSING. Los deploys reales van por integraciones nativas Vercel/Railway; este CD por Actions queda SALTADO (no es un fallo). Para activarlo, carga los 6 secrets (DEVOPS_NOTES §11.D) y vuelve a disparar."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Secrets de deploy presentes: el CD por Actions continúa."
          fi

  # ---------------------------------------------------------------------------
  # GATE: CI verde. Con workflow_run, exige conclusion == success. En disparo
  # manual (workflow_dispatch) se asume que el operador ya verificó CI/E2E.
  # (Refuerza además con branch protection: ci-ok, sast-ok y e2e como
  #  required status checks de la rama de release — ver DEVOPS_NOTES §5/§14.)
  # Solo corre si `secrets-gate` marcó ready == 'true'.
  # NOMBRE (§56 #9, 2026-09-11): antes se llamaba `ci-ok`, igual que el gate
  # final de ci.yml. GitHub identifica los required checks por NOMBRE de job:
  # dos jobs homónimos en workflows distintos hacen ambiguo el required check
  # y este —que casi nunca corre— podía bloquear la protección de rama.
  # ---------------------------------------------------------------------------
  deploy-ci-gate:
    needs: [secrets-gate]
    if: needs.secrets-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que CI terminó verde
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            echo "CI (workflow_run) conclusion=$CONCLUSION"
            if [ "$CONCLUSION" != "success" ]; then
              echo "::error::CI no terminó en 'success' (fue '$CONCLUSION'). Se ABORTA el deploy."
              exit 1
            fi
          else
            echo "Disparo manual (workflow_dispatch): se asume CI/E2E verdes ya verificados."
          fi

  # ---------------------------------------------------------------------------
  # preflight: confirma que existen TODOS los secrets de deploy. Si falta alguno,
  # FALLA con la lista exacta (no continúa, no despliega a medias).
  # ---------------------------------------------------------------------------
  preflight:
    needs: [deploy-ci-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secrets de deploy (GitHub Secrets)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          MISSING=""
          for VAR in RAILWAY_TOKEN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID STAGING_BASE_URL PROD_BASE_URL; do
            if [ -z "${!VAR}" ]; then MISSING="$MISSING $VAR"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Faltan GitHub Secrets de deploy:$MISSING"
            echo "::error::Cárgalos en Settings > Secrets and variables > Actions (ver DEVOPS_NOTES §11.C). El deploy NO continúa."
            exit 1
          fi
          echo "Todos los secrets de deploy presentes. Continúa el pipeline."

  # ---------------------------------------------------------------------------
  # GATE E2E REAL: stack completo (mocks=false) contra endpoints reales. Es el
  # gate que hace que "verde" signifique "funciona de verdad" (arreglo Paso 5).
  # Reutiliza e2e-real.yml (workflow_call); spin-up de su propio stack efímero,
  # no depende de los deploys de staging. Debe pasar ANTES de promover a prod.
  # REQUISITO: runner-harness con navegadores Playwright preinstalados (ver
  # e2e-real.yml / DEVOPS_NOTES §5.1). `secrets: inherit` pasa STRIPE_TEST_*.
  # ---------------------------------------------------------------------------
  e2e-real:
    needs: [preflight]
    uses: ./.github/workflows/e2e-real.yml
    # `require_real_stripe: true` — ÉSTA es la ruta de promoción a prod, y el dueño
    # decidió (2026-08-24) verificar los TRES flujos de dinero en navegador con clave
    # de PRUEBA antes de desplegar, en vez de aceptarlos formalmente. Sin `sk_test_…`
    # real el backend responde 503 PAYMENT_PROVIDER_UNAVAILABLE y los tres smokes son
    # rojos; el preflight de e2e-real.yml lo dice de frente en vez de dejar que se
    # descubra 20 minutos después en un rojo de Playwright. Ver DEVOPS_NOTES §31.
    with:
      require_real_stripe: true
    secrets: inherit

  # ---------------------------------------------------------------------------
  # STAGING — Backend a Railway (environment staging).
  # `railway up` sube el repo y construye con Dockerfile.backend (ver railway.json).
  # Al arrancar, el contenedor corre `prisma migrate deploy` (Dockerfile CMD).
  # ---------------------------------------------------------------------------
  deploy-staging-backend:
    needs: [preflight]
    runs-on: ubuntu-latest
    outputs:
      # Instante ANTERIOR al deploy. El gate de procedencia (job `staging-serves-head`)
      # exige que el proceso que responde en staging haya NACIDO después de esto.
      # Ver SEC-OPS-1 · DEVOPS_NOTES §38.5.
      deploy_epoch: ${{ steps.mark.outputs.epoch }}
    environment:
      # NOTA: `environment.url` NO admite el contexto `secrets` (solo env/github/
      # inputs/needs/vars…). Ponerlo ahí hace que GitHub rechace el workflow al
      # arrancar (startup_failure: 0 jobs). El link de despliegue es cosmético;
      # se omite. El objetivo de STAGING_BASE_URL es el DAST (job dast-staging).
      name: staging
    steps:
      - uses: actions/checkout@v5
      - id: mark
        name: Marcar el instante ANTES del deploy (procedencia)
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Instalar Railway CLI
        run: npm i -g @railway/cli@latest
      - name: Deploy backend a Railway (staging)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          : "${RAILWAY_TOKEN:?falta RAILWAY_TOKEN}"
          echo "Desplegando servicio '$RAILWAY_BACKEND_SERVICE' a Railway (staging)..."
          railway up --service "$RAILWAY_BACKEND_SERVICE" --environment staging --ci
      # Nota: el SEED inicial (diales M10 + super_admin + operador) NO se corre
      # aquí; es una acción de UNA sola vez tras el primer deploy:
      #   railway run --service backend --environment staging npm run seed
      # (ver DEVOPS_NOTES §11.D). En staging, el harness usa datos SINTÉTICOS.

  # ---------------------------------------------------------------------------
  # STAGING — Frontend a Vercel (preview = staging).
  # Las NEXT_PUBLIC_* viven en el proyecto de Vercel (env "Preview"); `vercel pull`
  # las trae y `vercel build` las hornea. Debe incluir NEXT_PUBLIC_USE_MOCKS=false.
  # ---------------------------------------------------------------------------
  deploy-staging-frontend:
    needs: [preflight]
    runs-on: ubuntu-latest
    environment:
      name: staging
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Instalar Vercel CLI
        run: npm i -g vercel@latest
      - name: Deploy frontend a Vercel (preview/staging)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_TOKEN:?falta VERCEL_TOKEN}"
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          DEPLOY_URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Frontend staging desplegado: $DEPLOY_URL"
          echo "STAGING_DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
      # El dominio estable de staging (alias) lo apunta Vercel al proyecto; el
      # DAST usa STAGING_BASE_URL (dominio estable), no la URL efímera del deploy.

  # ---------------------------------------------------------------------------
  # GATE DE PROCEDENCIA — SEC-OPS-1 (docs/SECURITY_NOTES.md §9, DEVOPS_NOTES §38.5)
  #
  # EL AGUJERO QUE CIERRA: `dast-staging` escanea `STAGING_BASE_URL`, un dominio
  # ESTABLE. `needs: [deploy-staging-*]` garantiza el ORDEN de los jobs, no que el
  # rollout de Railway/Vercel haya TOMADO EFECTO. Si el rollout va lento, o falló y
  # la plataforma dejó en pie la revisión anterior, ZAP y nuclei escanean el binario
  # VIEJO — y su verde promueve a producción un commit que nadie escaneó.
  # Es el mismo fallo que se comió el gate de seguridad dos veces en local
  # (backend de las 15:04 auditando el arreglo de las 16:16), con el mismo sentido
  # peligroso: aprobar lo que no se probó.
  #
  # CÓMO SE PRUEBA: `GET /api/v1/health` devuelve `uptime` = `process.uptime()`
  # (medido en health.service.ts). De ahí sale el instante REAL de arranque del
  # proceso que atiende. Si ese instante es ANTERIOR al inicio del deploy, el
  # rollout no tomó efecto. Bajo `concurrency: deploy-*` (un deploy a la vez), la
  # cadena «desplegué este commit» + «el proceso vivo nació después» ⇒ «staging
  # sirve este commit».
  #
  # LO QUE **NO** PRUEBA: no es una firma del artefacto. El cierre definitivo es que
  # `/health` devuelva el commit — eso es `backend/src/modules/health/`, rol BACKEND,
  # y está pedido en DEVOPS_NOTES §38.6. Mientras tanto, esto.
  #
  # STAGING_API_URL: base del backend de staging (p. ej. https://api-staging.tcghunt.mx/api/v1).
  # NO está en la lista de `secrets-gate` a propósito — añadirla allí rompería el
  # pipeline de quien ya lo tenía configurado. En su lugar: sin ella el gate AVISA,
  # y si se está promoviendo a producción, FALLA. Un DAST que no puede decir qué
  # binario escaneó no puede ser la puerta de prod.
  # ---------------------------------------------------------------------------
  # ⚠️ INERTE (P-77): este job no corre nunca — el pipeline está apagado y no hay
  # staging desplegado. El gate de procedencia que SÍ corre está en e2e-real.yml y
  # en security-dast.yml, contra el stack efímero. Ver la tabla de la cabecera.
  staging-serves-head:
    needs: [deploy-staging-backend, deploy-staging-frontend]
    runs-on: ubuntu-latest
    env:
      STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
      DEPLOY_EPOCH: ${{ needs.deploy-staging-backend.outputs.deploy_epoch }}
      # MISMA expresión que el `if:` de los dos jobs `promote-production-*` (abajo),
      # a propósito: si ellos consideran que esto es una promoción, este gate también.
      # Si se divergen, este gate deja de cubrir la ruta que importa.
      PROMOTING: ${{ github.event_name == 'workflow_run' || inputs.promote_to_prod == true }}
    steps:
      - uses: actions/checkout@v5
      - name: ¿Staging sirve el commit que se va a promover?
        run: |
          if [ -z "$STAGING_API_URL" ]; then
            MSG="No hay STAGING_API_URL: NO se puede comprobar que staging sirva ${GITHUB_SHA}. El DAST de abajo escaneará un binario de procedencia DESCONOCIDA."
            if [ "$PROMOTING" = "true" ]; then
              echo "::error::$MSG Se ABORTA la promoción a producción (SEC-OPS-1). Carga STAGING_API_URL — ver DEVOPS_NOTES §38.5."
              exit 1
            fi
            echo "::warning::$MSG No bloquea porque no se está promoviendo a prod, pero el resultado del DAST NO es citable como gate."
            echo "- ⚠️ procedencia de staging **no verificada** (falta \`STAGING_API_URL\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # El rollout tarda; se le da margen antes de declararlo obsoleto.
          for i in $(seq 1 40); do
            if ./scripts/assert-serving-head.sh \
                 --url "${STAGING_API_URL%/}/health" \
                 --label "staging (commit $GITHUB_SHA)" \
                 --newer-than "$DEPLOY_EPOCH" \
                 --quiet; then
              echo "Staging sirve un proceso nacido de ESTE deploy."
              echo "- ✅ staging sirve el proceso desplegado en este run (\`$GITHUB_SHA\`)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Rollout aún no visible en staging... ($i/40)"; sleep 15
          done
          echo "::error::Tras ~10min, staging SIGUE sirviendo un proceso anterior a este deploy. El rollout no tomó efecto (o falló y quedó la revisión previa). Escanear ahora daría un veredicto sobre el binario EQUIVOCADO — SEC-OPS-1. Se ABORTA."
          ./scripts/assert-serving-head.sh --url "${STAGING_API_URL%/}/health" --label "staging" --newer-than "$DEPLOY_EPOCH" || true
          exit 1

  # ---------------------------------------------------------------------------
  # DAST contra STAGING: ZAP baseline + nuclei. GATE de promoción a prod.
  # Necesita STAGING_BASE_URL en vivo (el frontend/back de staging ya desplegados).
  # Corre DESPUÉS de `staging-serves-head`: sin saber QUÉ binario hay enfrente, un
  # DAST verde no significa nada (SEC-OPS-1).
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # PARIDAD DEL PROVEEDOR DE PRECIO EN STAGING (`I-PP5`, API_CONTRACT §M10-PP).
  #
  # EL AGUJERO QUE CIERRA (medido el 2026-09-10, ARCHITECTURE §4.35a(d)): el DAST
  # de abajo recorre superficies de DINERO (vitrina, cotizador) alimentadas por el
  # barrido de precios de staging. Si ese barrido no es el que corre en producción,
  # el gate aprueba un sistema distinto del que promueve — «un gate que aprueba
  # otro sistema no es un gate: es una ceremonia».
  #
  # Es la hermana de `staging-serves-head`: aquella pregunta «¿qué BINARIO hay
  # enfrente?», ésta pregunta «¿con qué DATO DE DINERO está alimentado?». Las dos
  # tienen el mismo modo de fallo si faltan: un verde que no significa nada.
  #
  # ⚠️ POR QUÉ NO SE ARREGLA SOLO, aunque `D-PP-1` mergee: los seeds MATERIALIZAN
  # la fila `ConfigSetting` (`upsert(... update:{})`), así que un entorno YA
  # SEMBRADO —el staging hospedado lo está— conserva su valor viejo aunque el seed
  # del código cambie (ARCHITECTURE §11.0, DEVOPS_NOTES §32.1). Por eso aquí se
  # MIDE (`--assert`, solo lectura) en cada corrida y NO se escribe: staging es un
  # entorno de verdad y su dial se mueve con un humano delante (`I-PP3`).
  #
  # SECRETS (los carga el humano — DEVOPS_NOTES §43.2):
  #   STAGING_API_URL              (ya usado por staging-serves-head)
  #   STAGING_ADMIN_EMAIL / STAGING_ADMIN_PASSWORD  (super_admin de STAGING, datos
  #   sintéticos; ⛔ jamás credenciales de producción).
  # Sin ellos NO se puede leer el dial (la ruta es @Roles(super_admin)): se AVISA,
  # y si se está promoviendo a prod, FALLA — mismo criterio que §38.5.
  # ---------------------------------------------------------------------------
  # ⚠️ INERTE (P-77): no corre. Su versión viva —y ya EJECUTABLE, sin necesidad de
  # STAGING_ADMIN_EMAIL/PASSWORD— corre contra el stack efímero en security-dast.yml
  # y e2e-real.yml: allí el admin lo crea el seed sintético. Ver §44.5.
  staging-provider-parity:
    needs: [staging-serves-head]
    runs-on: ubuntu-latest
    env:
      STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
      ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      PROMOTING: ${{ github.event_name == 'workflow_run' || inputs.promote_to_prod == true }}
    steps:
      - uses: actions/checkout@v5
      - name: ¿Staging evalúa el MISMO proveedor de precio que producción?
        run: |
          if [ -z "$STAGING_API_URL" ] || [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            MSG="Sin STAGING_API_URL + STAGING_ADMIN_EMAIL/PASSWORD no se puede LEER el dial price_provider de staging (GET /admin/settings es @Roles(super_admin))."
            if [ "$PROMOTING" = "true" ]; then
              echo "::error::$MSG El DAST de abajo escanearía precios de procedencia DESCONOCIDA. Se ABORTA la promoción (I-PP5). Carga los secrets — DEVOPS_NOTES §43.2."
              exit 1
            fi
            echo "::warning::$MSG No bloquea porque no se promueve a prod, pero el DAST NO es citable como gate del barrido que se promueve."
            echo "- ⚠️ paridad del proveedor de precio **no verificada** (faltan secrets)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Solo lectura. Un rojo aquí NO es «staging está roto»: es «staging no
          # está midiendo lo mismo que producción», y el arreglo es un PUT auditado
          # por el panel M10, no un cambio de código.
          ./scripts/price-provider-parity.sh --assert --api-base "$STAGING_API_URL"
          echo "- ✅ staging evalúa el proveedor de precio PRIMARIO (\`I-PP5\`)" >> "$GITHUB_STEP_SUMMARY"

  # ⚠️ INERTE (P-77): NUNCA ejecutó un escaneo. Apunta a `STAGING_BASE_URL`, un
  # secret que jamás existió. El DAST que SÍ corre está en security-dast.yml,
  # semanal, contra el stack efímero, y con autoprueba del candado. Ver §44.
  dast-staging:
    needs: [deploy-staging-backend, deploy-staging-frontend, staging-serves-head, staging-provider-parity]
    runs-on: ubuntu-latest
    outputs:
      critical: ${{ steps.gate.outputs.critical }}
    env:
      TARGET_URL: ${{ secrets.STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Guardia anti-producción
        run: |
          : "${TARGET_URL:?falta STAGING_BASE_URL}"
          echo "DAST target (staging): $TARGET_URL"
      - name: ZAP baseline contra staging
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.TARGET_URL }}
          rules_file_name: security/zap/baseline.conf
          # -I: no falla por WARN; los FAIL de baseline.conf marcan el gate.
          cmd_options: "-I"
          fail_action: true
      - name: nuclei contra staging
        run: |
          mkdir -p security/reports
          docker run --rm -v "${{ github.workspace }}/security:/sec" \
            projectdiscovery/nuclei:latest \
            -u "$TARGET_URL" \
            -tags "$(grep -vE '^\s*#|^\s*$' security/nuclei/templates.txt | paste -sd, -)" \
            -severity high,critical \
            -rate-limit 50 \
            -jsonl -o /sec/reports/nuclei.jsonl || true
      - id: gate
        name: Evaluar hallazgos críticos
        run: |
          CRIT=false
          if [ -f security/reports/nuclei.jsonl ] && grep -Eq '"severity":"(high|critical)"' security/reports/nuclei.jsonl; then
            CRIT=true
          fi
          echo "critical=$CRIT" >> "$GITHUB_OUTPUT"
          if [ "$CRIT" = "true" ]; then
            echo "::error::DAST encontró hallazgos críticos/altos. Se BLOQUEA la promoción a producción."
            exit 1
          fi
          echo "DAST sin hallazgos críticos/altos: apto para promover."

  # ---------------------------------------------------------------------------
  # PRODUCCIÓN — Backend a Railway (environment production).
  # Requiere aprobación manual del Environment "production" (required reviewers).
  # Solo corre si el DAST de staging pasó Y (en disparo manual) promote_to_prod.
  # ---------------------------------------------------------------------------
  promote-production-backend:
    needs: [dast-staging, e2e-real]
    if: >-
      needs.dast-staging.outputs.critical == 'false' &&
      needs.e2e-real.result == 'success' &&
      (github.event_name == 'workflow_run' || inputs.promote_to_prod == true)
    runs-on: ubuntu-latest
    environment:
      # protégelo con "required reviewers" en GitHub. Sin `url:` a propósito:
      # `environment.url` no admite el contexto `secrets` (causaba startup_failure).
      name: production
    steps:
      - uses: actions/checkout@v5
      - name: Recordatorio de snapshot de DB (rollback)
        run: |
          echo "::notice::Antes de promover: toma snapshot / point-in-time de la DB de PROD."
          echo "::notice::Railway Postgres: Backups > Create backup (o point-in-time). Ver DEVOPS_NOTES §7."
      - name: Instalar Railway CLI
        run: npm i -g @railway/cli@latest
      - name: Deploy backend a Railway (production)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          : "${RAILWAY_TOKEN:?falta RAILWAY_TOKEN}"
          echo "Desplegando servicio '$RAILWAY_BACKEND_SERVICE' a Railway (production)..."
          railway up --service "$RAILWAY_BACKEND_SERVICE" --environment production --ci
          # `prisma migrate deploy` corre en el arranque del contenedor (Dockerfile CMD).
      # ATENCIÓN a lo que este paso ES y a lo que NO ES (hueco anotado, DEVOPS_NOTES §32.11):
      # esto es un RECORDATORIO, no un gate. La verificación de diales que el DoD exige
      # (§32.2) depende hoy de que un humano corra `post-deploy.sh`. Techlead lo llamó
      # «enforcement de honor» y tiene razón: un detector que sólo funciona si te acuerdas
      # es indistinguible de uno que no corrió. Sigue manual por una contrapartida real
      # —automatizarlo exige un JWT de `super_admin` de PROD guardado en CI, que es una
      # llave maestra para cualquier job del workflow—, y eso es decisión del humano, no
      # de devops. La vía barata sin secretos nuevos (grep de `config inventory` sobre
      # `railway logs`, que ya usa el RAILWAY_TOKEN existente) está PROPUESTA y SIN CABLEAR
      # en §32.11: no se cablea un detector que no se ha visto correr.
      # El `::warning::` es deliberado: un `::notice::` se pierde; un warning sale en el
      # resumen del run.
      - name: Recordatorio de secuencia POST-DEPLOY (NO es un gate — ver DEVOPS_NOTES §32.11)
        run: |
          echo "::warning title=Post-deploy manual pendiente::El deploy NO termina aquí y este paso NO lo verifica. Los diales de §32.2 siguen sin comprobar hasta que corras post-deploy.sh (enforcement manual, DEVOPS_NOTES §32.11)."
          echo "::notice::  railway run --service backend --environment production bash scripts/post-deploy.sh"
          echo "::notice::Runbook vigente: DEVOPS_NOTES §29 (cut-over v2.0/P-48). Histórico: §27."
          echo "::notice::v2.0: 'repriciar' = RE-RESOLVER (publish-all, opt-in RUN_PUBLISH_ALL=1), no un UPDATE masivo."
          echo "::notice::Luego revisa la cola: GET /admin/pricing/pending -> counts.premium_at_floor (~3 por cada 333 cartas)."

  # ---------------------------------------------------------------------------
  # PRODUCCIÓN — Frontend a Vercel (--prod).
  # ---------------------------------------------------------------------------
  promote-production-frontend:
    needs: [dast-staging, e2e-real, promote-production-backend]
    if: >-
      needs.dast-staging.outputs.critical == 'false' &&
      needs.e2e-real.result == 'success' &&
      (github.event_name == 'workflow_run' || inputs.promote_to_prod == true)
    runs-on: ubuntu-latest
    environment:
      # Sin `url:` a propósito: `environment.url` no admite `secrets` (startup_failure).
      name: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Instalar Vercel CLI
        run: npm i -g vercel@latest
      - name: Deploy frontend a Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_TOKEN:?falta VERCEL_TOKEN}"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Frontend producción desplegado: $DEPLOY_URL"
