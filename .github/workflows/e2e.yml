# =============================================================================
# e2e.yml — Suites E2E de FEEDBACK RÁPIDO en cada PR/push  ·  Propiedad: devops
# Marketplace TCG con Bóveda (Pokémon, México)
# =============================================================================
# Dos suites, ambas pensadas para dar señal RÁPIDA en cada cambio:
#   - backend:  npm run test:integration   (integración con DB/Redis reales via
#               service containers; suite propiedad del rol backend)
#   - frontend: npm run test:e2e (Playwright) en MODO MOCK — el webServer del
#               playwright.config levanta Next con NEXT_PUBLIC_USE_MOCKS=true.
#               NO levanta el stack docker (rápido). El Chromium se instala en el
#               job con `npx playwright install --with-deps chromium` (runner
#               estándar `ubuntu-latest`).
#
# SEPARACIÓN mock vs real (arreglo Paso 5):
#   - ESTE workflow = MOCK, rápido, feedback de PR. "Verde" aquí NO garantiza
#     que los endpoints reales funcionen (usa fixtures).
#   - El E2E en modo REAL (stack completo, NEXT_PUBLIC_USE_MOCKS=false, endpoints
#     reales) vive en `.github/workflows/e2e-real.yml` y actúa como GATE previo a
#     producción (+ nightly). Ese es el que hace que "verde" signifique
#     "funciona de verdad". Ver DEVOPS_NOTES §5.1.
#
# POLÍTICA DE GATE (arreglo 2026-08-19, ver DEVOPS_NOTES §24 — incidente Railway
# «backend congelado 11 h»):
#   - `backend-e2e` = DEPLOY-BLOCKING. Es integración REAL (Postgres+Redis+MinIO
#     como services); un fallo aquí es un bug real. Si falla, `e2e-ok` falla y el
#     deploy se bloquea. NO cambia.
#   - `frontend-e2e` (MOCK) = INFORMATIVO, NO deploy-blocking. Corre en cada
#     push/PR y nightly como señal de regresión de UI contra fixtures, pero un
#     fallo de aserción NO congela el deploy del backend (el gate REAL de UI es
#     e2e-real.yml, stack completo). Un fallo de MOCK se reporta como ::warning::
#     y se enruta al rol frontend; el job termina verde para no bloquear Railway.
#     OJO: los fallos de INFRAESTRUCTURA del job (instalar Chromium) SÍ son duros
#     — solo se ablandan las aserciones de la suite, no el arranque del entorno.
#
# Por qué así y no quitar «Wait for CI» de Railway: Railway espera al check-suite
# COMPLETO de GitHub Actions; un solo job en rojo (aunque sea MOCK) tumba el
# suite y congela el deploy. La única palanca determinista desde el repo es que el
# job MOCK no reporte failure. Los gates money-safe (build + backend-e2e +
# seguridad) siguen DUROS y sí bloquean. Ver DEVOPS_NOTES §24.
#
#   Nombres de script (los exponen los roles backend/frontend):
#     backend/package.json  -> "test:integration"
#     frontend/package.json -> "test:e2e"   (Playwright)
# =============================================================================

name: E2E

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Detecta apps y presencia de los scripts E2E.
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend_e2e: ${{ steps.check.outputs.backend_e2e }}
      frontend_e2e: ${{ steps.check.outputs.frontend_e2e }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          be=false; fe=false
          if [ -f backend/package.json ]; then
            if node -e "process.exit(require('./backend/package.json').scripts?.['test:integration']?0:1)"; then
              be=true
            else
              echo "::warning title=backend::backend/package.json no expone 'test:integration'; el job E2E de backend fallará (gate real)."
              be=missing
            fi
          fi
          if [ -f frontend/package.json ]; then
            if node -e "process.exit(require('./frontend/package.json').scripts?.['test:e2e']?0:1)"; then
              fe=true
            else
              echo "::warning title=frontend::frontend/package.json no expone 'test:e2e'; el job E2E de frontend fallará (gate real)."
              fe=missing
            fi
          fi
          echo "backend_e2e=$be"  >> "$GITHUB_OUTPUT"
          echo "frontend_e2e=$fe" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Backend E2E / integración: DB + Redis + MinIO reales como services.
  # ---------------------------------------------------------------------------
  backend-e2e:
    needs: detect
    if: needs.detect.outputs.backend_e2e != 'false'
    runs-on: ubuntu-latest
    # `fase` la fija el último paso (always) y la lee `e2e-ok`: distingue «la
    # suite corrió y falló» de «el job murió antes y no midió nada» (S-CI-1).
    outputs:
      fase: ${{ steps.fase.outputs.fase }}
      paso: ${{ steps.fase.outputs.paso }}
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tcg
          # S-88-1 (antes `tcg_e2e`): el `env:` de un service container se evalúa
          # ANTES del primer paso, así que no puede venir de `$GITHUB_ENV`. Una
          # expresión de workflow sí, y da un valor distinto por corrida que no
          # está escrito en ningún fichero de este repo público.
          POSTGRES_PASSWORD: e2e_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_DB: tcg_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tcg -d tcg_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      minio:
        # FIX (pull failure): antes `bitnami/minio:latest`. Bitnami vació su
        # namespace en Docker Hub (migración a "Bitnami Secure Images", ago-2025):
        # `bitnami/minio` ya NO tiene tags -> el pull en "Initialize containers"
        # fallaba y ABORTABA backend-e2e antes de correr un test. Se apunta al
        # namespace `bitnamilegacy/minio:latest`, que conserva la MISMA imagen
        # (auto-arranca el server y crea buckets con MINIO_DEFAULT_BUCKETS), a
        # donde Bitnami movió las imágenes. Alternativa (minio/minio oficial) no
        # sirve como service de Actions: exige un `command` (server /data) que los
        # service containers de GitHub no permiten pasar.
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          # S-88-1 (antes `minioadmin_e2e`). Mismo motivo que Postgres arriba.
          MINIO_ROOT_PASSWORD: e2e_${{ github.run_id }}_${{ github.run_attempt }}
          MINIO_DEFAULT_BUCKETS: tcg-photos:download
        ports: ["9000:9000", "9001:9001"]
        # SIN --health-cmd a propósito: la imagen (minideb) NO trae `curl`, así que
        # un healthcheck `curl .../minio/health/live` DENTRO del contenedor nunca
        # pasa -> el service queda unhealthy y GitHub ABORTA el job antes de correr
        # un solo test. La readiness de MinIO se comprueba desde el RUNNER (que sí
        # tiene curl) en el paso "Esperar a que MinIO responda" de abajo.
        # Postgres/Redis sí traen sus binarios (pg_isready/redis-cli) y conservan
        # su healthcheck.
    env:
      DATABASE_URL: postgresql://tcg:e2e_${{ github.run_id }}_${{ github.run_attempt }}@localhost:5432/tcg_e2e?schema=public
      REDIS_URL: redis://localhost:6379
      # S-88-1 — aquí había dos literales JWT y un respaldo `|| 'sk_test_e2e_dummy'`.
      # El respaldo tiene el defecto justo al revés de como parece: el valor público
      # gana **cuando el secret NO está cargado**, o sea exactamente cuando alguien
      # creyó configurarlo y no lo hizo. Ahora los tres los resuelve
      # `scripts/secrets-preflight.sh` en el paso «Resolver secretos» (abajo):
      # respeta el valor del secret store si existe, y si no genera uno aleatorio
      # por corrida en vez de heredar el del repo.
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY || 'pk_test_e2e_dummy' }}
      # RESIDUAL DE P-WH-1 — el literal público desapareció de aquí.
      # Decía `${{ secrets.X || 'whsec_e2e_dummy' }}`. Esa forma tiene el defecto
      # justo al revés de como parece: **el valor público gana cuando el secret NO
      # está cargado**, o sea, exactamente cuando alguien creyó configurar Stripe y
      # no lo hizo. Y `whsec_e2e_dummy` está commiteado en un repo público: para un
      # HMAC es una clave perfectamente válida con la que cualquiera puede firmar.
      # Ahora lo resuelve `scripts/webhook-secret-preflight.sh` en un paso (abajo):
      # sin Stripe genera uno EFÍMERO irrepetible; con Stripe real y sin secreto
      # propio, ABORTA el job en vez de correr sobre algo forjable.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: tcg-photos
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: e2e_${{ github.run_id }}_${{ github.run_attempt }}
      S3_PUBLIC_BASE_URL: http://localhost:9000/tcg-photos
      S3_FORCE_PATH_STYLE: "true"
      DEFAULT_LOCALE: es
      NODE_ENV: test
      SEED_MODE: synthetic
      # ---------------------------------------------------------------------
      # E2E_STRICT_INFRA — EL INTERRUPTOR QUE NUNCA SE HABÍA ENCENDIDO (§39.2)
      #
      # `backend/test/integration/infra-smoke.e2e-spec.ts` trae desde siempre:
      #     const STRICT = process.env.E2E_STRICT_INFRA === 'true';
      # y sin él, un Redis que no responde o un PUT presignado que devuelve 403
      # se SALTAN con `console.warn` + `return`, y la suite sale VERDE. El propio
      # comentario del spec dice «recomendado en el job E2E de CI con toda la
      # infra» — y nadie lo puso: `grep -rn E2E_STRICT_INFRA` sobre el repo
      # entero no devolvía NINGUNA asignación. La rama estricta existía y jamás
      # se ejecutó, así que la subida del INE (`purpose: kyc_ine`, PII) llevaba
      # dos releases sin ejercitarse ni aquí ni en local.
      #
      # Este job tiene la infra COMPLETA (postgres + redis + minio como
      # services, con el bucket `tcg-photos` creado por MINIO_DEFAULT_BUCKETS y
      # credenciales que cuadran con las S3_* de abajo), así que exigirla no es
      # una exigencia imposible: es la configuración normal. Si el smoke se pone
      # rojo aquí, el hallazgo es de INFRAESTRUCTURA (devops) y hay que mirarlo,
      # no saltarlo.
      #
      # MEDIDO en local sobre el MISMO spec y el mismo entorno roto (S3 caído):
      #   · sin la variable  -> `Tests: 3 passed` (el PUT se salta con warn)
      #   · con la variable  -> `Tests: 1 failed, 2 passed` (ECONNREFUSED)
      # Mismo código, misma infra rota, dos veredictos opuestos. Ése era el hueco.
      # ---------------------------------------------------------------------
      E2E_STRICT_INFRA: "true"
      # §4.38(r.6.1) — este job levanta la app Nest EN PROCESO y sus specs de
      # integración del gancho ENCIENDEN el dial único (`gradingHookEnabled`).
      # Con v1.51 ese flip autoriza el ingest, así que la credencial del proveedor
      # de paga se declara VACÍA aquí igual que en e2e-real.yml: sin llave, el
      # proveedor sale con `warn` antes de la primera petición.
      POKEMONPRICETRACKER_API_KEY: ''
    steps:
      - uses: actions/checkout@v5
      # -----------------------------------------------------------------------
      # RESOLUCIÓN DEL SECRETO DE WEBHOOK (residual de P-WH-1) — antes de nada.
      # Un hecho, un sitio: la misma resolución que corre en el arranque del
      # contenedor (`Dockerfile.backend`) y en el arnés nativo.
      #
      # S-CI-1 (seguridad, 2026-09-11): el `working-directory` del job es
      # `backend/`, y los tres scripts viven en la RAÍZ del repo. Sin el override
      # de abajo, este paso moría con rc=127 («No such file or directory»), los
      # ocho pasos siguientes quedaban `skipped` y el job —DEPLOY-BLOCKING— salió
      # rojo en 9 corridas seguidas (#1124→#1134) sin ejecutar una sola suite. El
      # mismo bloque en `ci.yml` SÍ llevaba el override. Ahora lo vigila
      # `scripts/check-workflow-cwd.sh` en cada PR (ci.yml, job `workflow-cwd`).
      # -----------------------------------------------------------------------
      - name: Resolver secretos sin literales públicos (P-WH-1 + S-88-1)
        id: secrets
        working-directory: ${{ github.workspace }}
        env:
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          # Si el secret store los trae, se respetan; si no, se generan aleatorios.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          # S-CI-1, segunda causa (run #1136, 2026-09-11): con la clave de PRUEBA
          # real en los secrets y sin STRIPE_TEST_WEBHOOK_SECRET, el preflight
          # ABORTA salvo que se le diga que Stripe NO puede alcanzar este stack.
          # e2e-real.yml lo declaraba; este bloque —copiado de ahí— no. Es
          # cierto por construcción: la app corre en el runner, sin URL pública;
          # ningún webhook real llega. Se genera un secreto efímero (§50.4) y los
          # specs firman contra él. Reproducido con scripts/run-workflow-step.sh.
          STRIPE_WEBHOOK_UNREACHABLE: "1"
        run: |
          ./scripts/webhook-secret-preflight.sh assert
          # `echo "VAR=$(resolve)" >> $GITHUB_ENV` NO se usa: MEDIDO (S-88-1) que
          # `echo` sale 0 aunque la sustitución aborte, y entonces se exporta un
          # valor VACÍO y el rojo aparece 8 pasos más tarde, en el `compose`, con un
          # mensaje que apunta al sitio equivocado. Es el mismo patrón que
          # perseguimos: la ausencia degradaba en silencio. Aquí se captura y se
          # comprueba, así que el fallo sale donde se produce.
          WH="$(./scripts/webhook-secret-preflight.sh resolve)"
          [ -n "$WH" ] || { echo "::error::el preflight del webhook no devolvió valor"; exit 1; }
          echo "STRIPE_WEBHOOK_SECRET=$WH" >> "$GITHUB_ENV"
          ./scripts/secrets-preflight.sh github-env \
            JWT_ACCESS_SECRET JWT_REFRESH_SECRET STRIPE_SECRET_KEY >> "$GITHUB_ENV"
      - name: Guarda — el entorno E2E no puede escribir contra el proveedor de paga
        id: provider_guard
        run: ./scripts/check-e2e-provider-incapacitation.sh
        working-directory: ${{ github.workspace }}
      - name: Guard — el script test:integration debe existir
        id: script_guard
        run: |
          if [ "${{ needs.detect.outputs.backend_e2e }}" = "missing" ]; then
            echo "::error::backend no expone 'npm run test:integration'. El rol backend debe añadirlo."
            exit 1
          fi
      - uses: actions/setup-node@v5
        id: setup_node
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        id: install
        run: npm ci
      - name: Esperar a que MinIO responda (readiness desde el runner)
        id: minio
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO arriba (bucket por defecto tcg-photos creado en el arranque)."
              exit 0
            fi
            echo "Esperando MinIO... ($i)"; sleep 2
          done
          echo "::error::MinIO no respondió en http://localhost:9000 tras ~60s."
          exit 1
      - name: Prisma generate + migrate
        id: prisma
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Seed sintético (si existe)
        id: seed
        run: npm run seed:synthetic --if-present
      # El log de la suite se conserva en fichero: los agentes de este proyecto NO
      # pueden leer el blob de logs de Actions (el proxy lo bloquea, SECURITY_NOTES
      # §0 y DEVOPS_NOTES §16.4), así que el paso siguiente convierte cada spec en
      # rojo en una ANOTACIÓN (visible por la API de check-runs) con fichero y línea.
      - name: Test de integración (E2E backend)
        id: tests
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee "$RUNNER_TEMP/backend-e2e.log"
      - name: Anotar cada spec en rojo con fichero y línea (legible por API)
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        run: |
          LOG="$RUNNER_TEMP/backend-e2e.log"
          [ -s "$LOG" ] || { echo "::warning title=backend-e2e::la suite falló pero el log está vacío; no puedo anotar specs."; exit 0; }
          echo "Specs en rojo (jest 'FAIL <spec>'):"
          grep -E '^(FAIL|PASS) ' "$LOG" | sort | uniq -c || true
          # Una anotación por spec fallido (jest imprime 'FAIL test/integration/x.e2e-spec.ts').
          grep -E '^FAIL ' "$LOG" | awk '{print $2}' | sort -u | head -20 | while read -r spec; do
            # Primer test '●' de ese spec y su primera línea 'at … (spec:linea:col)'.
            test_name="$(awk -v s="$spec" '$0 ~ "^FAIL "s {f=1} f && /^  ● / {print; exit}' "$LOG" | sed 's/^  ● //')"
            linea="$(grep -oE "${spec//./\\.}:[0-9]+:[0-9]+" "$LOG" | head -1 | cut -d: -f2)"
            echo "::error file=backend/${spec},line=${linea:-1},title=backend-e2e · suite en ROJO (dueño: backend)::${spec} — ${test_name:-ver log}"
          done
          FALLOS="$(grep -E '^Tests: ' "$LOG" | tail -1 || true)"
          [ -n "$FALLOS" ] && echo "::error title=backend-e2e · resumen jest::${FALLOS}"
          exit 0
      - name: Subir log de la suite de integración
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: backend-e2e-log
          path: ${{ runner.temp }}/backend-e2e.log
          if-no-files-found: ignore
          retention-days: 7
      # -----------------------------------------------------------------------
      # VEREDICTO DE FASE (S-CI-1, DEVOPS_NOTES §52): «rojo» no es un veredicto.
      # Este job estuvo rojo 9 corridas seguidas por rc=127 en el paso 4 y se leyó
      # como «la suite falla» (dueño por defecto: backend, §16.4). Un rojo tiene
      # que decir QUÉ se midió: si la suite CORRIÓ y falló (dueño: backend), o si
      # el job MURIÓ ANTES y no midió nada (dueño: devops). Va INLINE a propósito:
      # no puede depender de un fichero que el propio checkout podría no traer.
      # -----------------------------------------------------------------------
      - name: Veredicto de fase — ¿la suite corrió, o el job murió antes?
        id: fase
        if: ${{ always() }}
        env:
          O_SECRETS: ${{ steps.secrets.outcome }}
          O_PROVIDER: ${{ steps.provider_guard.outcome }}
          O_SCRIPT: ${{ steps.script_guard.outcome }}
          O_NODE: ${{ steps.setup_node.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_MINIO: ${{ steps.minio.outcome }}
          O_PRISMA: ${{ steps.prisma.outcome }}
          O_SEED: ${{ steps.seed.outcome }}
          O_TESTS: ${{ steps.tests.outcome }}
        run: |
          fase=""; paso=""
          if [ "$O_TESTS" = "success" ]; then
            fase="suite-verde"; paso="Test de integración (E2E backend)"
          elif [ "$O_TESTS" = "failure" ]; then
            fase="suite-roja"; paso="Test de integración (E2E backend)"
            echo "::error title=backend-e2e · LA SUITE CORRIÓ y falló::Dueño: backend. Los specs en rojo están anotados con fichero y línea en el paso anterior; el log completo en el artifact backend-e2e-log."
          else
            for par in "Resolver secretos:$O_SECRETS" "Guarda proveedor de paga:$O_PROVIDER" "Guard test:integration:$O_SCRIPT" \
                       "setup-node:$O_NODE" "Install:$O_INSTALL" "Esperar MinIO:$O_MINIO" "Prisma generate + migrate:$O_PRISMA" "Seed sintético:$O_SEED"; do
              nombre="${par%:*}"; res="${par##*:}"
              if [ "$res" = "failure" ]; then paso="$nombre"; break; fi
            done
            fase="infra-muerta"
            echo "::error title=backend-e2e NO MIDIÓ NADA::El job murió en el paso «${paso:-desconocido}» ANTES de ejecutar la suite (la suite quedó skipped). Dueño: devops (infraestructura del job), NO backend. Ninguna suite de dinero/acceso se ejecutó en esta corrida: este rojo no dice nada sobre el código. DEVOPS_NOTES §52."
          fi
          echo "fase=$fase" >> "$GITHUB_OUTPUT"
          echo "paso=$paso" >> "$GITHUB_OUTPUT"
          echo "fase=$fase · paso=$paso"
          {
            echo "### backend-e2e — veredicto de fase"
            echo
            echo "- **fase:** \`$fase\`"
            echo "- **paso decisivo:** $paso"
            echo "- resultados: secrets=$O_SECRETS provider=$O_PROVIDER guard=$O_SCRIPT node=$O_NODE install=$O_INSTALL minio=$O_MINIO prisma=$O_PRISMA seed=$O_SEED tests=$O_TESTS"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Frontend E2E — MODO MOCK (rápido, feedback de PR).
  # El webServer del playwright.config levanta Next con NEXT_PUBLIC_USE_MOCKS=true
  # (fixtures); NO se levanta el stack docker.
  #
  # NAVEGADOR (fix 2026-08-17): este job corre en `ubuntu-latest` (runner estándar
  # de GitHub), donde NO existe ningún Chromium preinstalado. La configuración
  # anterior apuntaba a /opt/pw-browsers (ruta que solo existe en el runner-harness
  # local) y el "Guard navegador" reventaba el job en cada PR. Ahora se usa el
  # approach estándar de Playwright en Actions: `npx playwright install --with-deps
  # chromium` DESPUÉS del `npm ci` del frontend (el CLI vive en node_modules).
  #
  # OJO: "verde" aquí valida la UI contra FIXTURES, no contra endpoints reales.
  # La verificación de que los endpoints reales funcionan es el GATE de
  # e2e-real.yml (stack completo, mocks=false). Ver DEVOPS_NOTES §5.1.
  # ---------------------------------------------------------------------------
  frontend-e2e:
    needs: detect
    if: needs.detect.outputs.frontend_e2e != 'false'
    runs-on: ubuntu-latest
    env:
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY || 'pk_test_e2e_dummy' }}
      # NO se fija E2E_BASE_URL a propósito: así el playwright.config levanta su
      # propio webServer Next en modo mocks (NEXT_PUBLIC_USE_MOCKS=true).
      # ---------------------------------------------------------------------
      # §4.38(r.6.1) — incapacitación frente al proveedor de PAGA. Este job corre
      # en modo MOCK y NO debería tocar API real… pero «no debería» es justo la
      # clase de afirmación que este pase existe para no aceptar: basta con que
      # alguien fije `E2E_BASE_URL` aquí (o que un spec lo haga) para que el arnés
      # encienda el dial único contra un backend de verdad. Declarado, no omitido.
      # Verificado por scripts/check-e2e-provider-incapacitation.sh.
      # ---------------------------------------------------------------------
      POKEMONPRICETRACKER_API_KEY: ''
      E2E_GRADING_PROVIDER_INCAPACITATED: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Guard — el script test:e2e debe existir
        run: |
          if [ "${{ needs.detect.outputs.frontend_e2e }}" = "missing" ]; then
            echo "::error::frontend no expone 'npm run test:e2e'. El rol frontend debe añadirlo."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps frontend
        working-directory: frontend
        run: npm ci
      # Después del `npm ci` a propósito: el CLI `playwright` vive en
      # frontend/node_modules, antes de instalarlo `npx` no lo encuentra.
      # `--with-deps` añade las libs de sistema que Chromium necesita en el runner.
      #
      # El export de PLAYWRIGHT_CHROMIUM_PATH NO es decorativo: frontend/playwright.
      # config.ts (rol frontend) fija `launchOptions.executablePath =
      # process.env.PLAYWRIGHT_CHROMIUM_PATH ?? '/opt/pw-browsers/chromium'`. Sin
      # ese export, Playwright intentaría lanzar la ruta del runner-harness (que no
      # existe aquí) e ignoraría el navegador recién instalado. Se resuelve la ruta
      # real con la API oficial (`chromium.executablePath()`), no a mano.
      - name: Instalar Chromium de Playwright
        working-directory: frontend
        # ROBUSTEZ (2026-08-18): ver la nota extendida en security-sast.yml. `--with-deps`
        # ejecuta `apt-get` por dentro, y un mirror atascado deja el job colgado en vez de
        # fallar (visto: 15 min parados aquí). timeout + 3 intentos.
        # CORRECCIÓN (2026-08-18, misma noche): ver la nota extendida en security-sast.yml.
        # `timeout` mata apt a mitad de la descarga de fuentes y el proceso huérfano CONSERVA
        # el lock de dpkg -> los intentos 2 y 3 morían al instante con "Could not get lock".
        # Ahora se libera el lock antes de reintentar, y el margen sube a 420 s por intento
        # (el fallo real fue un mirror lento bajando 21 MB de fuentes, no un cuelgue).
        timeout-minutes: 25
        run: |
          set -uo pipefail
          liberar_apt() {
            sudo pkill -x apt-get 2>/dev/null || true
            sudo pkill -x dpkg 2>/dev/null || true
            for _ in $(seq 1 30); do
              sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
              sleep 2
            done
            sudo dpkg --configure -a >/dev/null 2>&1 || true
          }
          for intento in 1 2 3; do
            if timeout 420 npx playwright install --with-deps chromium; then
              break
            fi
            if [ "$intento" = "3" ]; then
              echo "::error title=No se pudo instalar Chromium::3 intentos agotados."
              exit 1
            fi
            echo "::warning title=Instalacion de Chromium fallida::Intento $intento agotado o fallido; liberando lock de apt y reintentando."
            liberar_apt
            sleep 10
          done
          CHROMIUM_BIN="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          if [ ! -x "$CHROMIUM_BIN" ]; then
            echo "::error title=Chromium no quedó instalado::No existe/ejecutable: $CHROMIUM_BIN"
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_PATH=$CHROMIUM_BIN" >> "$GITHUB_ENV"
          echo "Chromium instalado: $CHROMIUM_BIN"
      # SOFT-GATE (2026-08-19, §24): la suite MOCK es INFORMATIVA, no deploy-blocking.
      # `continue-on-error` ablanda SOLO las aserciones de Playwright — el paso previo
      # de instalar Chromium sigue siendo duro (un fallo de infra ahí sí revienta el
      # job). Así un rojo de fixtures/UI no congela el deploy del backend en Railway,
      # mientras el gate REAL de UI (e2e-real.yml) y backend-e2e siguen bloqueando.
      - name: E2E frontend (MOCK — el config levanta Next con mocks=true)
        id: mock_e2e
        continue-on-error: true
        working-directory: frontend
        run: npm run test:e2e
      - name: Resultado E2E MOCK (informativo — NO bloquea el deploy)
        run: |
          if [ "${{ steps.mock_e2e.outcome }}" = "failure" ]; then
            echo "::warning title=E2E MOCK en rojo (informativo)::La suite Playwright MOCK falló. Es señal de PR/nightly, NO bloquea el deploy (el gate REAL de UI es e2e-real.yml, stack completo). Enrutar el fallo al rol frontend (spec en frontend/e2e/). Reporte: artifact playwright-report-mock. Ver DEVOPS_NOTES §24."
          else
            echo "E2E MOCK verde."
          fi
      - name: Subir reporte Playwright
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-mock
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Gate final E2E — DEPLOY-BLOCKING.
  # Bloquea SOLO por `backend-e2e` (integración real Postgres+Redis+MinIO). El
  # `frontend-e2e` MOCK es INFORMATIVO (§24): su fallo NO tumba este gate ni el
  # deploy de Railway; el gate REAL de UI es e2e-real.yml. Con el soft-gate del
  # job MOCK, `needs.frontend-e2e.result` normalmente será 'success' aunque las
  # aserciones fallen (se degradan a ::warning::); la rama informativa de abajo
  # queda como red de seguridad y para transparencia en el resumen.
  # ---------------------------------------------------------------------------
  e2e-ok:
    needs: [detect, backend-e2e, frontend-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resumen
        env:
          FASE: ${{ needs.backend-e2e.outputs.fase }}
          PASO: ${{ needs.backend-e2e.outputs.paso }}
        run: |
          echo "backend-e2e  (deploy-blocking): ${{ needs.backend-e2e.result }} · fase=${FASE:-?} · paso=${PASO:-?}"
          echo "frontend-e2e (informativo):     ${{ needs.frontend-e2e.result }}"
          # S-CI-1: un rojo sin fase se leyó seis commits como «la suite falla». Aquí el
          # rojo NOMBRA lo que se midió y a quién le toca — y `skipped`/`cancelled`
          # tampoco son verde: un gate deploy-blocking que no corre no gatea.
          case "${{ needs.backend-e2e.result }}" in
            success) ;;
            failure)
              case "$FASE" in
                suite-roja)   echo "::error::backend-e2e: LA SUITE CORRIÓ y falló (integración real DB/Redis/MinIO). Dueño: backend. Specs anotados en el job. Bloquea el deploy." ;;
                infra-muerta) echo "::error::backend-e2e NO MIDIÓ NADA: el job murió en «${PASO:-?}» antes de ejecutar la suite. Dueño: devops. Ninguna suite de dinero/acceso corrió. Bloquea el deploy (DEVOPS_NOTES §52)." ;;
                *)            echo "::error::backend-e2e falló y NO dejó fase (¿el paso de veredicto no corrió?). Dueño: devops. Bloquea el deploy." ;;
              esac
              exit 1 ;;
            *)
              echo "::error::backend-e2e terminó en '${{ needs.backend-e2e.result }}' — no es verde: un gate deploy-blocking que no corre no gatea. Bloquea el deploy."
              exit 1 ;;
          esac
          if [ "${{ needs.frontend-e2e.result }}" = "failure" ]; then
            echo "::warning::frontend-e2e MOCK falló (informativo). NO bloquea el deploy. Ver DEVOPS_NOTES §24."
          fi
          echo "E2E gate OK (backend-e2e verde)."
