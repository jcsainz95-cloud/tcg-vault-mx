# =============================================================================
# e2e.yml — Suites E2E de FEEDBACK RÁPIDO en cada PR/push  ·  Propiedad: devops
# Marketplace TCG con Bóveda (Pokémon, México)
# =============================================================================
# Dos suites, ambas pensadas para dar señal RÁPIDA en cada cambio:
#   - backend:  npm run test:integration   (integración con DB/Redis reales via
#               service containers; suite propiedad del rol backend)
#   - frontend: npm run test:e2e (Playwright) en MODO MOCK — el webServer del
#               playwright.config levanta Next con NEXT_PUBLIC_USE_MOCKS=true.
#               NO levanta el stack docker (rápido). El Chromium se instala en el
#               job con `npx playwright install --with-deps chromium` (runner
#               estándar `ubuntu-latest`).
#
# SEPARACIÓN mock vs real (arreglo Paso 5):
#   - ESTE workflow = MOCK, rápido, feedback de PR. "Verde" aquí NO garantiza
#     que los endpoints reales funcionen (usa fixtures).
#   - El E2E en modo REAL (stack completo, NEXT_PUBLIC_USE_MOCKS=false, endpoints
#     reales) vive en `.github/workflows/e2e-real.yml` y actúa como GATE previo a
#     producción (+ nightly). Ese es el que hace que "verde" signifique
#     "funciona de verdad". Ver DEVOPS_NOTES §5.1.
#
# POLÍTICA DE GATE (arreglo 2026-08-19, ver DEVOPS_NOTES §24 — incidente Railway
# «backend congelado 11 h»):
#   - `backend-e2e` = DEPLOY-BLOCKING. Es integración REAL (Postgres+Redis+MinIO
#     como services); un fallo aquí es un bug real. Si falla, `e2e-ok` falla y el
#     deploy se bloquea. NO cambia.
#   - `frontend-e2e` (MOCK) = INFORMATIVO, NO deploy-blocking. Corre en cada
#     push/PR y nightly como señal de regresión de UI contra fixtures, pero un
#     fallo de aserción NO congela el deploy del backend (el gate REAL de UI es
#     e2e-real.yml, stack completo). Un fallo de MOCK se reporta como ::warning::
#     y se enruta al rol frontend; el job termina verde para no bloquear Railway.
#     OJO: los fallos de INFRAESTRUCTURA del job (instalar Chromium) SÍ son duros
#     — solo se ablandan las aserciones de la suite, no el arranque del entorno.
#
# Por qué así y no quitar «Wait for CI» de Railway: Railway espera al check-suite
# COMPLETO de GitHub Actions; un solo job en rojo (aunque sea MOCK) tumba el
# suite y congela el deploy. La única palanca determinista desde el repo es que el
# job MOCK no reporte failure. Los gates money-safe (build + backend-e2e +
# seguridad) siguen DUROS y sí bloquean. Ver DEVOPS_NOTES §24.
#
#   Nombres de script (los exponen los roles backend/frontend):
#     backend/package.json  -> "test:integration"
#     frontend/package.json -> "test:e2e"   (Playwright)
# =============================================================================

name: E2E

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Detecta apps y presencia de los scripts E2E.
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend_e2e: ${{ steps.check.outputs.backend_e2e }}
      frontend_e2e: ${{ steps.check.outputs.frontend_e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          be=false; fe=false
          if [ -f backend/package.json ]; then
            if node -e "process.exit(require('./backend/package.json').scripts?.['test:integration']?0:1)"; then
              be=true
            else
              echo "::warning title=backend::backend/package.json no expone 'test:integration'; el job E2E de backend fallará (gate real)."
              be=missing
            fi
          fi
          if [ -f frontend/package.json ]; then
            if node -e "process.exit(require('./frontend/package.json').scripts?.['test:e2e']?0:1)"; then
              fe=true
            else
              echo "::warning title=frontend::frontend/package.json no expone 'test:e2e'; el job E2E de frontend fallará (gate real)."
              fe=missing
            fi
          fi
          echo "backend_e2e=$be"  >> "$GITHUB_OUTPUT"
          echo "frontend_e2e=$fe" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Backend E2E / integración: DB + Redis + MinIO reales como services.
  # ---------------------------------------------------------------------------
  backend-e2e:
    needs: detect
    if: needs.detect.outputs.backend_e2e != 'false'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tcg
          POSTGRES_PASSWORD: tcg_e2e
          POSTGRES_DB: tcg_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tcg -d tcg_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
      minio:
        # FIX (pull failure): antes `bitnami/minio:latest`. Bitnami vació su
        # namespace en Docker Hub (migración a "Bitnami Secure Images", ago-2025):
        # `bitnami/minio` ya NO tiene tags -> el pull en "Initialize containers"
        # fallaba y ABORTABA backend-e2e antes de correr un test. Se apunta al
        # namespace `bitnamilegacy/minio:latest`, que conserva la MISMA imagen
        # (auto-arranca el server y crea buckets con MINIO_DEFAULT_BUCKETS), a
        # donde Bitnami movió las imágenes. Alternativa (minio/minio oficial) no
        # sirve como service de Actions: exige un `command` (server /data) que los
        # service containers de GitHub no permiten pasar.
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin_e2e
          MINIO_DEFAULT_BUCKETS: tcg-photos:download
        ports: ["9000:9000", "9001:9001"]
        # SIN --health-cmd a propósito: la imagen (minideb) NO trae `curl`, así que
        # un healthcheck `curl .../minio/health/live` DENTRO del contenedor nunca
        # pasa -> el service queda unhealthy y GitHub ABORTA el job antes de correr
        # un solo test. La readiness de MinIO se comprueba desde el RUNNER (que sí
        # tiene curl) en el paso "Esperar a que MinIO responda" de abajo.
        # Postgres/Redis sí traen sus binarios (pg_isready/redis-cli) y conservan
        # su healthcheck.
    env:
      DATABASE_URL: postgresql://tcg:tcg_e2e@localhost:5432/tcg_e2e?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: e2e_access_secret_dummy
      JWT_REFRESH_SECRET: e2e_refresh_secret_dummy
      # Stripe en modo TEST para E2E (claves de prueba, nunca live).
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY || 'sk_test_e2e_dummy' }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY || 'pk_test_e2e_dummy' }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET || 'whsec_e2e_dummy' }}
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: tcg-photos
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin_e2e
      S3_PUBLIC_BASE_URL: http://localhost:9000/tcg-photos
      S3_FORCE_PATH_STYLE: "true"
      DEFAULT_LOCALE: es
      NODE_ENV: test
      SEED_MODE: synthetic
      # §4.38(r.6.1) — este job levanta la app Nest EN PROCESO y sus specs de
      # integración del gancho ENCIENDEN el dial único (`gradingHookEnabled`).
      # Con v1.51 ese flip autoriza el ingest, así que la credencial del proveedor
      # de paga se declara VACÍA aquí igual que en e2e-real.yml: sin llave, el
      # proveedor sale con `warn` antes de la primera petición.
      POKEMONPRICETRACKER_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - name: Guarda — el entorno E2E no puede escribir contra el proveedor de paga
        run: ./scripts/check-e2e-provider-incapacitation.sh
        working-directory: ${{ github.workspace }}
      - name: Guard — el script test:integration debe existir
        run: |
          if [ "${{ needs.detect.outputs.backend_e2e }}" = "missing" ]; then
            echo "::error::backend no expone 'npm run test:integration'. El rol backend debe añadirlo."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Esperar a que MinIO responda (readiness desde el runner)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO arriba (bucket por defecto tcg-photos creado en el arranque)."
              exit 0
            fi
            echo "Esperando MinIO... ($i)"; sleep 2
          done
          echo "::error::MinIO no respondió en http://localhost:9000 tras ~60s."
          exit 1
      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy
      - name: Seed sintético (si existe)
        run: npm run seed:synthetic --if-present
      - name: Test de integración (E2E backend)
        run: npm run test:integration

  # ---------------------------------------------------------------------------
  # Frontend E2E — MODO MOCK (rápido, feedback de PR).
  # El webServer del playwright.config levanta Next con NEXT_PUBLIC_USE_MOCKS=true
  # (fixtures); NO se levanta el stack docker.
  #
  # NAVEGADOR (fix 2026-08-17): este job corre en `ubuntu-latest` (runner estándar
  # de GitHub), donde NO existe ningún Chromium preinstalado. La configuración
  # anterior apuntaba a /opt/pw-browsers (ruta que solo existe en el runner-harness
  # local) y el "Guard navegador" reventaba el job en cada PR. Ahora se usa el
  # approach estándar de Playwright en Actions: `npx playwright install --with-deps
  # chromium` DESPUÉS del `npm ci` del frontend (el CLI vive en node_modules).
  #
  # OJO: "verde" aquí valida la UI contra FIXTURES, no contra endpoints reales.
  # La verificación de que los endpoints reales funcionan es el GATE de
  # e2e-real.yml (stack completo, mocks=false). Ver DEVOPS_NOTES §5.1.
  # ---------------------------------------------------------------------------
  frontend-e2e:
    needs: detect
    if: needs.detect.outputs.frontend_e2e != 'false'
    runs-on: ubuntu-latest
    env:
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY || 'pk_test_e2e_dummy' }}
      # NO se fija E2E_BASE_URL a propósito: así el playwright.config levanta su
      # propio webServer Next en modo mocks (NEXT_PUBLIC_USE_MOCKS=true).
      # ---------------------------------------------------------------------
      # §4.38(r.6.1) — incapacitación frente al proveedor de PAGA. Este job corre
      # en modo MOCK y NO debería tocar API real… pero «no debería» es justo la
      # clase de afirmación que este pase existe para no aceptar: basta con que
      # alguien fije `E2E_BASE_URL` aquí (o que un spec lo haga) para que el arnés
      # encienda el dial único contra un backend de verdad. Declarado, no omitido.
      # Verificado por scripts/check-e2e-provider-incapacitation.sh.
      # ---------------------------------------------------------------------
      POKEMONPRICETRACKER_API_KEY: ''
      E2E_GRADING_PROVIDER_INCAPACITATED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Guard — el script test:e2e debe existir
        run: |
          if [ "${{ needs.detect.outputs.frontend_e2e }}" = "missing" ]; then
            echo "::error::frontend no expone 'npm run test:e2e'. El rol frontend debe añadirlo."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps frontend
        working-directory: frontend
        run: npm ci
      # Después del `npm ci` a propósito: el CLI `playwright` vive en
      # frontend/node_modules, antes de instalarlo `npx` no lo encuentra.
      # `--with-deps` añade las libs de sistema que Chromium necesita en el runner.
      #
      # El export de PLAYWRIGHT_CHROMIUM_PATH NO es decorativo: frontend/playwright.
      # config.ts (rol frontend) fija `launchOptions.executablePath =
      # process.env.PLAYWRIGHT_CHROMIUM_PATH ?? '/opt/pw-browsers/chromium'`. Sin
      # ese export, Playwright intentaría lanzar la ruta del runner-harness (que no
      # existe aquí) e ignoraría el navegador recién instalado. Se resuelve la ruta
      # real con la API oficial (`chromium.executablePath()`), no a mano.
      - name: Instalar Chromium de Playwright
        working-directory: frontend
        # ROBUSTEZ (2026-08-18): ver la nota extendida en security-sast.yml. `--with-deps`
        # ejecuta `apt-get` por dentro, y un mirror atascado deja el job colgado en vez de
        # fallar (visto: 15 min parados aquí). timeout + 3 intentos.
        # CORRECCIÓN (2026-08-18, misma noche): ver la nota extendida en security-sast.yml.
        # `timeout` mata apt a mitad de la descarga de fuentes y el proceso huérfano CONSERVA
        # el lock de dpkg -> los intentos 2 y 3 morían al instante con "Could not get lock".
        # Ahora se libera el lock antes de reintentar, y el margen sube a 420 s por intento
        # (el fallo real fue un mirror lento bajando 21 MB de fuentes, no un cuelgue).
        timeout-minutes: 25
        run: |
          set -uo pipefail
          liberar_apt() {
            sudo pkill -x apt-get 2>/dev/null || true
            sudo pkill -x dpkg 2>/dev/null || true
            for _ in $(seq 1 30); do
              sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
              sleep 2
            done
            sudo dpkg --configure -a >/dev/null 2>&1 || true
          }
          for intento in 1 2 3; do
            if timeout 420 npx playwright install --with-deps chromium; then
              break
            fi
            if [ "$intento" = "3" ]; then
              echo "::error title=No se pudo instalar Chromium::3 intentos agotados."
              exit 1
            fi
            echo "::warning title=Instalacion de Chromium fallida::Intento $intento agotado o fallido; liberando lock de apt y reintentando."
            liberar_apt
            sleep 10
          done
          CHROMIUM_BIN="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          if [ ! -x "$CHROMIUM_BIN" ]; then
            echo "::error title=Chromium no quedó instalado::No existe/ejecutable: $CHROMIUM_BIN"
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_PATH=$CHROMIUM_BIN" >> "$GITHUB_ENV"
          echo "Chromium instalado: $CHROMIUM_BIN"
      # SOFT-GATE (2026-08-19, §24): la suite MOCK es INFORMATIVA, no deploy-blocking.
      # `continue-on-error` ablanda SOLO las aserciones de Playwright — el paso previo
      # de instalar Chromium sigue siendo duro (un fallo de infra ahí sí revienta el
      # job). Así un rojo de fixtures/UI no congela el deploy del backend en Railway,
      # mientras el gate REAL de UI (e2e-real.yml) y backend-e2e siguen bloqueando.
      - name: E2E frontend (MOCK — el config levanta Next con mocks=true)
        id: mock_e2e
        continue-on-error: true
        working-directory: frontend
        run: npm run test:e2e
      - name: Resultado E2E MOCK (informativo — NO bloquea el deploy)
        run: |
          if [ "${{ steps.mock_e2e.outcome }}" = "failure" ]; then
            echo "::warning title=E2E MOCK en rojo (informativo)::La suite Playwright MOCK falló. Es señal de PR/nightly, NO bloquea el deploy (el gate REAL de UI es e2e-real.yml, stack completo). Enrutar el fallo al rol frontend (spec en frontend/e2e/). Reporte: artifact playwright-report-mock. Ver DEVOPS_NOTES §24."
          else
            echo "E2E MOCK verde."
          fi
      - name: Subir reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mock
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Gate final E2E — DEPLOY-BLOCKING.
  # Bloquea SOLO por `backend-e2e` (integración real Postgres+Redis+MinIO). El
  # `frontend-e2e` MOCK es INFORMATIVO (§24): su fallo NO tumba este gate ni el
  # deploy de Railway; el gate REAL de UI es e2e-real.yml. Con el soft-gate del
  # job MOCK, `needs.frontend-e2e.result` normalmente será 'success' aunque las
  # aserciones fallen (se degradan a ::warning::); la rama informativa de abajo
  # queda como red de seguridad y para transparencia en el resumen.
  # ---------------------------------------------------------------------------
  e2e-ok:
    needs: [detect, backend-e2e, frontend-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resumen
        run: |
          echo "backend-e2e  (deploy-blocking): ${{ needs.backend-e2e.result }}"
          echo "frontend-e2e (informativo):     ${{ needs.frontend-e2e.result }}"
          if [ "${{ needs.backend-e2e.result }}" = "failure" ]; then
            echo "::error::backend-e2e (integración real DB/Redis/MinIO) falló. Bloquea el deploy."
            exit 1
          fi
          if [ "${{ needs.frontend-e2e.result }}" = "failure" ]; then
            echo "::warning::frontend-e2e MOCK falló (informativo). NO bloquea el deploy. Ver DEVOPS_NOTES §24."
          fi
          echo "E2E gate OK (backend-e2e verde)."
