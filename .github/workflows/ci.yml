# =============================================================================
# CI — lint + typecheck + test + build (backend y frontend)  ·  devops
# Marketplace TCG con Bóveda (Pokémon, México)
# =============================================================================
# Se dispara en push y PR. Pipeline TOLERANTE al estado greenfield: mientras
# `backend/` o `frontend/` no tengan `package.json`, sus jobs se SALTAN de forma
# limpia (no fallan el pipeline). En cuanto el rol correspondiente cree la app,
# el job se activa solo — sin tocar este archivo.
#
# El backend levanta servicios de Postgres y Redis para los tests de
# integración (mismos que docker-compose local). MinIO no se levanta en CI: los
# tests que tocan S3 deben usar el cliente S3 apuntado a un mock/localstack o
# mockearse; se documenta en docs/DEVOPS_NOTES.md.
#
# Convención de scripts npm esperada (backend y frontend):
#   lint | typecheck | test | build
# Cada job invoca solo los scripts que existan (los ausentes se saltan con aviso).
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Detecta qué apps existen ya (tienen package.json) para activar sus jobs.
  # ---------------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f backend/package.json ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=backend::backend/package.json aún no existe; se salta el job de backend."
          fi
          if [ -f frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=frontend::frontend/package.json aún no existe; se salta el job de frontend."
          fi

  # ---------------------------------------------------------------------------
  # Backend: NestJS + Prisma. Con servicios Postgres + Redis para integración.
  # ---------------------------------------------------------------------------
  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tcg
          POSTGRES_PASSWORD: tcg_ci
          POSTGRES_DB: tcg_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tcg -d tcg_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://tcg:tcg_ci@localhost:5432/tcg_ci?schema=public
      REDIS_URL: redis://localhost:6379
      # Secretos dummy para que la app arranque en tests (no se usan de verdad):
      JWT_ACCESS_SECRET: ci_access_secret_dummy
      JWT_REFRESH_SECRET: ci_refresh_secret_dummy
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: tcg-photos
      S3_ACCESS_KEY_ID: ci_dummy
      S3_SECRET_ACCESS_KEY: ci_dummy
      S3_PUBLIC_BASE_URL: http://localhost:9000/tcg-photos
      DEFAULT_LOCALE: es
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma generate + migrate (si hay schema)
        run: |
          if [ -f prisma/schema.prisma ]; then
            npx prisma generate
            npx prisma migrate deploy
          else
            echo "Sin prisma/schema.prisma todavía; se omite."
          fi
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Test
        run: npm test --if-present
      - name: Build
        run: npm run build --if-present

  # ---------------------------------------------------------------------------
  # Frontend: Next.js. Lint + typecheck + test + build.
  # ---------------------------------------------------------------------------
  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # NEXT_PUBLIC_* dummy para que el build no falle por variables faltantes.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
      NEXT_PUBLIC_DEFAULT_LOCALE: es
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Test
        run: npm test --if-present
      - name: Build
        run: npm run build --if-present

  # ---------------------------------------------------------------------------
  # BL-27 — «un diff no mezcla reformateo con lógica» (norma del arquitecto).
  # NO es un gate de estilo: no exige que el árbol esté formateado ni reformatea
  # nada. Solo bloquea el diff que reformatea Y ADEMÁS cambia comportamiento,
  # porque ése es el que hace INVISIBLE una línea de dinero a la revisión del
  # techlead y de la fase de seguridad. El commit de SOLO formato pasa.
  # Detalle del porqué y del algoritmo: scripts/check-format-mix.sh + DEVOPS_NOTES
  # §36 (era §34 antes de la fusión con main; ver la nota de renumeración de §35).
  # ---------------------------------------------------------------------------
  format-mix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El comparador necesita el commit BASE, no solo el HEAD.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Resolver base del diff
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet "${{ github.event.before }}^{commit}" >/dev/null 2>&1; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet origin/main^{commit} >/dev/null 2>&1; then
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi
      - name: Comparar (reformateo vs lógica)
        run: |
          BASE="${{ steps.base.outputs.ref }}"
          if [ -z "$BASE" ]; then
            echo "::notice title=format-mix::Sin commit base utilizable (rama nueva). No concluye; no se finge verde."
            exit 0
          fi
          set +e
          ./scripts/check-format-mix.sh "$BASE" "${{ github.sha }}"
          rc=$?
          set -e
          case "$rc" in
            0) exit 0 ;;
            2) echo "::notice title=format-mix::El comparador no pudo concluir (base inaccesible)."; exit 0 ;;
            *) echo "::error title=format-mix::Este diff mezcla reformateo con cambios de comportamiento (BL-27). Sepáralos en dos commits."; exit 1 ;;
          esac

  # ---------------------------------------------------------------------------
  # GUARDA DE DINERO (v1.51, M-48 · ARCHITECTURE §4.38r.6.1) — vive AQUÍ, en el
  # workflow que corre en CADA push y PR, y no solo en los workflows de E2E.
  #
  # Motivo, sin adornos: `e2e-real.yml` solo corre nightly, por `workflow_dispatch`
  # o llamado desde `deploy.yml` — y `deploy.yml` tiene su `workflow_run` COMENTADO
  # y su `secrets-gate` salta todo cuando no hay secrets (la corrida #52 salió VERDE
  # con sus 8 jobs saltados). Colgar esta verificación solo de ese pipeline sería
  # colgarla de algo que casi nunca corre. Es barata (lee YAML, sin red) y aquí sí
  # se ejecuta siempre.
  # ---------------------------------------------------------------------------
  e2e-provider-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: El entorno E2E no puede escribir contra el proveedor de PAGA
        run: ./scripts/check-e2e-provider-incapacitation.sh

  # ---------------------------------------------------------------------------
  # Gate final: resume el estado. Verde también en greenfield (jobs saltados).
  # Útil como required check en la protección de rama.
  # ---------------------------------------------------------------------------
  ci-ok:
    needs: [detect, backend, frontend, format-mix, e2e-provider-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultados
        run: |
          echo "backend:                  ${{ needs.backend.result }}"
          echo "frontend:                 ${{ needs.frontend.result }}"
          echo "format-mix:               ${{ needs.format-mix.result }}"
          echo "guarda proveedor de paga: ${{ needs.e2e-provider-guard.result }}"
          # Falla solo si algún job que SÍ corrió terminó en failure.
          if [ "${{ needs.backend.result }}" = "failure" ] || [ "${{ needs.frontend.result }}" = "failure" ] || [ "${{ needs.format-mix.result }}" = "failure" ]; then
            echo "::error::Algún job de CI falló."
            exit 1
          fi
          # La guarda de §4.38r.6.1 NO es opcional y NO se puede saltar: a diferencia
          # de backend/frontend (que pueden no existir en greenfield), este job corre
          # siempre. Cualquier resultado que no sea `success` es rojo — incluido
          # `skipped`, que es justo la forma en que un gate deja de gatear sin avisar.
          if [ "${{ needs.e2e-provider-guard.result }}" != "success" ]; then
            echo "::error::La guarda del proveedor de paga no terminó en verde (resultado: ${{ needs.e2e-provider-guard.result }}). Ver DEVOPS_NOTES §32.12."
            exit 1
          fi
          echo "CI OK (los jobs saltados son esperados mientras no exista el código)."
