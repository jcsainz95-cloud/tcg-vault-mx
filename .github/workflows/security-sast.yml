# =============================================================================
# security-sast.yml — SAST gate en cada PR/push  ·  Propiedad: devops
# Marketplace TCG con Bóveda (Pokémon, México)
# =============================================================================
# Corre en CADA push y pull_request:
#   - semgrep   (reglas OWASP/NestJS/React + reglas locales security/semgrep.yml)
#   - gitleaks  (secretos, con security/gitleaks.toml)
#   - npm audit (backend + frontend)
#   - trivy fs  (deps) + trivy image (imágenes Docker construidas)
#
# GATE: FALLA en high/critical. Úsalo como required status check en la rama de
# release junto con `ci-ok` (de ci.yml).
#
# ESTADO: ACTIVO ya (no requiere secrets ni plataforma). Todo corre con las
# actions/imágenes oficiales sobre el código del repo.
# =============================================================================

name: Security SAST

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: sast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write   # para subir SARIF a la pestaña Security (opcional)

jobs:
  # ---------------------------------------------------------------------------
  # Semgrep — SAST. ACTIVO.
  # ---------------------------------------------------------------------------
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    env:
      # Lista de configs compartida por el informe completo y el gate, para que
      # NO haya drift entre ambos. (No se llama SEMGREP_RULES a propósito: ese
      # nombre lo interpreta semgrep como config implícita.)
      SG_CONFIGS: >-
        --config=security/semgrep.yml
        --config=p/default
        --config=p/typescript
        --config=p/javascript
        --config=p/nodejs
        --config=p/react
        --config=p/owasp-top-ten
        --config=p/secrets
        --config=p/jwt
    steps:
      - uses: actions/checkout@v5
      # -----------------------------------------------------------------------
      # (1) Informe COMPLETO (todas las severidades) -> SARIF a la pestaña
      #     Security. NO bloquea: es VISIBILIDAD. El gate real es el paso (2).
      #     Las WARNING (heurísticas medias locales: recordatorios money-out,
      #     no-secret-in-logs) se ven aquí sin romper el pipeline.
      # -----------------------------------------------------------------------
      - name: Semgrep — informe completo (SARIF, no bloquea)
        run: |
          semgrep $SG_CONFIGS \
            --metrics=off --disable-version-check \
            --exclude=node_modules --exclude=.next --exclude=dist --exclude=coverage \
            --sarif --output=semgrep.sarif \
            backend/ frontend/ || true
      - name: Subir SARIF de Semgrep
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
      # -----------------------------------------------------------------------
      # (2) GATE real: bloquea SOLO en severidad ERROR (= high/critical), como
      #     dice la cabecera del workflow ("FALLA en high/critical"). Antes se
      #     usaba `--error` a secas, que rompía ante CUALQUIER hallazgo (incl.
      #     WARNING medias) — miscalibrado. `--severity=ERROR` alinea el gate con
      #     su intención documentada. Los ERROR reales (SQLi, webhook sin firma,
      #     reglas ERROR de OWASP/registry) SIGUEN bloqueando.
      # -----------------------------------------------------------------------
      - name: Semgrep GATE — bloquea en high/critical (severidad ERROR)
        run: |
          semgrep $SG_CONFIGS \
            --severity=ERROR \
            --error --metrics=off --disable-version-check \
            --exclude=node_modules --exclude=.next --exclude=dist --exclude=coverage \
            backend/ frontend/
      # -----------------------------------------------------------------------
      # ¿EL GATE DE SEMGREP MUERDE? (QA, lote 2026-09-11: 0 rojos en 60 corridas
      # no distingue «código limpio» de «gate inerte»). El canario planta, en un
      # repo temporal, un fichero que dispara reglas ERROR de `security/semgrep.yml`
      # y exige que ESTE mismo comando —mismas configs (SG_CONFIGS), misma
      # severidad— salga rojo; y que un fichero limpio salga verde. En `sh` POSIX
      # porque corre dentro del contenedor de semgrep. §56.
      # -----------------------------------------------------------------------
      - name: Canario de semgrep — el gate sabe ponerse rojo
        if: ${{ !cancelled() }}
        run: sh ./security/scripts/sast-semgrep-canary.sh

  # ---------------------------------------------------------------------------
  # gitleaks — secretos. ACTIVO.
  # ---------------------------------------------------------------------------
  gitleaks:
    runs-on: ubuntu-latest
    # Permisos ACOTADOS a este job (sobreescriben los del workflow, no lo amplían):
    # gitleaks-action necesita leer el repo y los metadatos del PR que escanea.
    # NO se le da `security-events: write` (no sube SARIF a code scanning: lo deja
    # como artifact) ni `pull-requests: write` (ver GITLEAKS_ENABLE_COMMENTS abajo).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # historial completo para escanear commits
      # 2026-09-11 (§56): @v2 → @v3. v3 es la misma acción sobre runtime node24
      # (README v3: «no changes to inputs, outputs, or behavior»); v2 corre sobre
      # node20, que GitHub retira de los runners el 2026-09-16. Se mantiene el
      # comportamiento medido: escanea el RANGO del push (`--log-opts … base^..head`)
      # y deja el SARIF como artifact. Se fija además GITLEAKS_VERSION al binario
      # con el que se midió la allowlist en local (§56): sin fijarlo, la acción
      # resuelve «latest» en cada corrida y la config se mide contra un escáner
      # que cambia solo.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # OBLIGATORIO: sin esto la acción aborta con
          #   "GITHUB_TOKEN is now required to scan pull requests"
          # (fue el fallo del release PR #3). Va por ENV, no por `with:` — así lo
          # documenta el README de gitleaks-action.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/security/gitleaks.toml
          GITLEAKS_VERSION: "8.30.1"
          # Comentarios en el PR DESACTIVADOS a propósito: publicarlos requiere
          # `pull-requests: write` y no queremos ese scope en un job de secretos.
          # El gate no se relaja: si hay leaks el job FALLA y el detalle está en el
          # log y en el artifact SARIF.
          GITLEAKS_ENABLE_COMMENTS: "false"
          # GITLEAKS_LICENSE solo hace falta para org accounts; en repos personales no.
      # -----------------------------------------------------------------------
      # C4 (S-GL-1) + P-GL-FP — el candado de secretos tiene que saber morder.
      # La acción deja el binario en PATH (`core.addPath`). Con ESE binario y
      # ESTA config, el canario planta una `sk_test_51…` de forma real y exige
      # rojo; planta los dos canarios de `scripts/` en su ruta y exige verde; y
      # el mismo contenido en otra ruta, rojo. Si alguien vuelve a ensanchar la
      # allowlist («sk_test_.*») o borra la ruta, esto lo dice en el mismo run.
      # `!cancelled()`: corre aunque el paso de arriba haya encontrado leaks —
      # un rojo real no puede apagar la autoprueba (lección de §53).
      # -----------------------------------------------------------------------
      - name: Canario de gitleaks — la clave de prueba real es roja; los canarios pasan por su ruta
        if: ${{ !cancelled() }}
        run: ./security/scripts/sast-gitleaks-canary.sh

  # ---------------------------------------------------------------------------
  # npm audit — backend + frontend. ACTIVO (se salta la app que no exista).
  # ---------------------------------------------------------------------------
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # GATE BLOQUEANTE (SEC-C2): falla en high/critical de dependencias de
      # RUNTIME (--omit=dev en audit-npm.sh). Cubre el bump de next/next-intl/
      # postcss (frontend) y express/multer/qs (backend). Es required check.
      - name: npm audit (gate high/critical — runtime)
        run: ./security/scripts/audit-npm.sh
        env:
          AUDIT_LEVEL: high
      # TRINQUETE DE devDependencies (P-DEP-1, pentester 2026-09-10).
      #
      # Aquí había un paso `continue-on-error: true` con un `|| true` dentro del
      # bucle: reportaba las críticas de tooling y NO podía cambiar el color de
      # nada. Resultado medido: 1 crítica (`vitest`) y 2 altas (`vite`, `js-yaml`)
      # llevaban ahí sin dueño, sin fecha y sin revisor hasta que el pentester las
      # nombró. Un escáner que nadie lee es un escáner apagado con más pasos.
      #
      # NO se sube el umbral ni se silencia nada. Cambia QUIÉN responde: cada
      # alto/crítico de tooling necesita una FICHA en
      # `security/npm-audit-dev-fichas.tsv` con dueño, fecha de revisión y el
      # motivo MEDIDO por el que no es alcanzable. Sin ficha -> rojo. Ficha
      # vencida -> rojo. Ficha que sobra porque ya se arregló -> aviso.
      #
      # Sigue SIN bloquear por el estado de hoy (está fichado): bloquea por
      # EMPEORAMIENTO y por el paso del tiempo. El gate de RUNTIME es el paso de
      # arriba y no admite fichas.
      - name: npm audit devDependencies — trinquete con fichas (P-DEP-1)
        if: ${{ !cancelled() }}
        run: AUDIT_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" ./security/scripts/audit-npm-dev.sh

      # Y el trinquete tiene que saber morder: mismo criterio que el self-test de
      # `trivy-fs`. Si esto se cae, lo de arriba puede haberse vuelto decorativo.
      - name: Self-test del trinquete (rojo ante hallazgo nuevo y ante ficha vencida)
        if: ${{ !cancelled() }}
        run: ./security/scripts/audit-npm-dev-selftest.sh

  # ---------------------------------------------------------------------------
  # Trivy filesystem — CVEs de dependencias. ACTIVO.
  #
  # FIX rate-limit: `aquasecurity/trivy-action` delega la instalación del binario
  # en `setup-trivy`, cuyo `contrib/install.sh` (godownloader) resuelve el tag con
  # una llamada SIN autenticar a `https://github.com/.../releases/<tag>` — ese script
  # NO lee ningún token, así que en las IPs compartidas de los runners se topa con el
  # rate-limit del endpoint web de GitHub y el paso muere ("found version" -> exit 1).
  # Pasar un token a la acción solo autentica el checkout del repo de trivy, no la
  # descarga del binario. Solución robusta: instalar Trivy desde el repo apt OFICIAL
  # de Aqua (GitHub Pages / CDN, sin rate-limit de API) y `skip-setup-trivy: true`.
  # Además damos al binario TRIVY_GITHUB_TOKEN para que el pull de la DB (GHCR/GitHub)
  # tampoco se limite. El gate NO se relaja: sigue fallando en HIGH/CRITICAL reales.
  # ---------------------------------------------------------------------------
  trivy-fs:
    runs-on: ubuntu-latest
    env:
      TRIVY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Instalar Trivy (repo apt oficial de Aqua — evita el rate-limit del instalador)
        # ROBUSTEZ (2026-08-18): timeout por comando + reintentos.
        # Sin esto, un mirror de apt que se atasca deja el job COLGADO hasta el timeout de
        # 6 h de Actions en lugar de fallar. Ocurrió 4 veces en una sola noche (trivy-fs ×2,
        # trivy-image, y el `playwright install` de e2e): 25 min parados en `apt-get`, sin
        # log ni señal. Es especialmente dañino aquí porque Railway espera al CHECK SUITE
        # COMPLETO: un job colgado bloquea el deploy indefinidamente y parece "aún corriendo".
        # `timeout` acota cada comando, 3 intentos absorben el fallo transitorio, y
        # `timeout-minutes` es el tope duro del step.
        # El gate NO se relaja: si tras 3 intentos no hay Trivy, el step FALLA (exit 1).
        # Nunca se continúa sin escanear.
        # CORRECCIÓN (2026-08-18, misma noche): la primera versión de este bloque reintentaba
        # sin soltar el lock. `timeout` mata apt A MITAD de la descarga y el proceso huérfano
        # CONSERVA /var/lib/dpkg/lock-frontend, así que los intentos 2 y 3 morían al instante
        # con "Could not get lock ... It is held by process N" — reintentos inútiles contra un
        # lock que el propio timeout dejaba tomado. `liberar_apt` lo suelta antes de reintentar.
        timeout-minutes: 20
        run: |
          set -uo pipefail
          liberar_apt() {
            sudo pkill -x apt-get 2>/dev/null || true
            sudo pkill -x dpkg 2>/dev/null || true
            for _ in $(seq 1 30); do
              sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
              sleep 2
            done
            sudo dpkg --configure -a >/dev/null 2>&1 || true
          }
          instalar_trivy() {
            sudo timeout 240 apt-get update -o Acquire::Retries=3 || return 1
            sudo timeout 240 apt-get install -y wget gnupg || return 1
            wget -qO - --timeout=30 --tries=3 https://aquasecurity.github.io/trivy-repo/deb/public.key \
              | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null || return 1
            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
              | sudo tee /etc/apt/sources.list.d/trivy.list || return 1
            sudo timeout 240 apt-get update -o Acquire::Retries=3 || return 1
            sudo timeout 300 apt-get install -y trivy || return 1
          }
          for intento in 1 2 3; do
            if instalar_trivy; then
              trivy --version
              exit 0
            fi
            echo "::warning title=Instalacion de Trivy fallida::Intento $intento agotado o fallido; liberando lock de apt y reintentando."
            liberar_apt
            sleep 10
          done
          echo "::error title=No se pudo instalar Trivy::3 intentos agotados. El gate NO se salta: el job falla."
          exit 1
      # -----------------------------------------------------------------------
      # S-SAST-1 (seguridad, 2026-09-11 — DEVOPS_NOTES §53). Aquí había una
      # `aquasecurity/trivy-action` con sus propios inputs. NO pasaba
      # `security/trivy.yaml`, así que corría con el default de `trivy fs`:
      # `vuln` + `secret`. El escáner de SECRETOS de trivy —que nadie había
      # decidido encender, y que duplica a gitleaks con OTRA allowlist— puso este
      # job en rojo 11 corridas seguidas (#1124→#1134) por cinco `sk_test_…` de
      # FICCIÓN en dos canarios de `scripts/`. Todo el equipo lo atribuyó a las
      # devDependencies del frontend (P-DEP-1): trivy ni siquiera las mira por
      # defecto. MEDIDO con el escáner real: 0 vulnerabilidades en los tres
      # lockfiles; 5 hallazgos, todos de `stripe-secret-token`.
      #
      # Ahora el gate es UN comando en UN sitio (`security/scripts/trivy-fs.sh`,
      # `--scanners vuln`, misma config, mismo ignorefile), el mismo que corre en
      # local y el que el self-test ejercita. El umbral no cambia: HIGH/CRITICAL,
      # sin ignore-unfixed, sin excepciones activas. Los secretos siguen gateados
      # por el job `gitleaks` de este workflow (con la allowlist de placeholders).
      # -----------------------------------------------------------------------
      - name: Trivy fs — dependencias de RUNTIME (HIGH/CRITICAL => fallo)
        run: ./security/scripts/trivy-fs.sh

      # -----------------------------------------------------------------------
      # Y las devDependencies, con LAS MISMAS fichas y LAS MISMAS fechas que
      # `npm audit` (S-SAST-1, la petición literal de seguridad: «que los dos
      # escáneres digan lo mismo sobre el mismo hecho»). Trivy con
      # `--include-dev-deps`, y su salida juzgada por `audit-npm-dev.sh` —el
      # mismo código, no una copia de la política—: sin ficha -> rojo; ficha
      # vencida -> rojo; ficha que trivy ya no ve -> aviso (podar).
      # -----------------------------------------------------------------------
      - name: Trivy fs — devDependencies bajo las mismas fichas que npm audit (P-DEP-1)
        if: ${{ !cancelled() }}
        run: AUDIT_SUMMARY_FILE="$GITHUB_STEP_SUMMARY" ./security/scripts/trivy-dev-fichas.sh

      # -----------------------------------------------------------------------
      # SELF-TEST: ¿el gate SABE ponerse rojo? (DEVOPS_NOTES §47.3, §53)
      #
      # Un gate que sólo se ha visto en verde no está verificado, está sin
      # observar. Este paso planta un lockfile con `dicer@0.3.0`
      # (CVE-2022-24434 — el hallazgo que bloqueó aquel release) y
      # `minimist@1.2.0` DENTRO de `scripts/s3-local/`, corre EL MISMO script
      # que el paso del gate, y EXIGE rojo por ESOS CVE. Planta también un
      # `sk_test_…` de ficción y exige que NO se reporte (alcance = vuln; los
      # secretos son de gitleaks). El canario se borra siempre (trap).
      #
      # Ya NO exige que la línea base esté verde: eso lo cegaba justo cuando el
      # gate llevaba 11 corridas en rojo («no puede medir nada encima de un rojo
      # real»). Anota la línea base y mide igual; el rojo real lo reporta el
      # paso del gate, que es cuyo trabajo es.
      # -----------------------------------------------------------------------
      - name: Self-test de trivy-fs (el candado tiene que saber morder)
        if: ${{ !cancelled() }}
        run: ./security/scripts/trivy-fs-selftest.sh

      # -----------------------------------------------------------------------
      # El registro de decisiones/excepciones de escáner, VISIBLE en cada
      # corrida. Motivo (§47.4): una excepción que sólo vive en un fichero de
      # configuración es una excepción que nadie revisa. Esto la pone delante
      # de quien mire el run — en particular del rol `seguridad` en la fase de
      # release. Fuente única: security/README.md entre los marcadores.
      # -----------------------------------------------------------------------
      - name: Publicar el registro de decisiones de escáner en el resumen
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          REGISTRO="$(sed -n '/<!-- REGISTRO:INICIO -->/,/<!-- REGISTRO:FIN -->/p' security/README.md \
                      | grep -v 'REGISTRO:INICIO\|REGISTRO:FIN' || true)"
          # Si el bloque desaparece, el paso FALLA a propósito: borrar el registro
          # es exactamente la forma de que una excepción vuelva a quedar invisible.
          if [ -z "${REGISTRO//[[:space:]]/}" ]; then
            echo "::error title=Registro de decisiones de escáner vacío::No encuentro el bloque entre <!-- REGISTRO:INICIO --> y <!-- REGISTRO:FIN --> en security/README.md. Ese bloque es lo que el rol seguridad audita en el release (DEVOPS_NOTES §47.4); sin él, cualquier excepción de Trivy queda sin revisor."
            exit 1
          fi
          {
            echo "## Registro de decisiones de escáner (Trivy)"
            echo
            echo "${REGISTRO}"
            echo
            echo "_Fuente: \`security/README.md\`. Excepciones activas de Trivy: \`security/.trivyignore\`._"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Trivy image — CVEs de las imágenes Docker. ACTIVO si existen los Dockerfiles.
  # Construye backend/frontend y escanea. Se salta si falta la app.
  # ---------------------------------------------------------------------------
  trivy-image:
    runs-on: ubuntu-latest
    env:
      # Ver nota de rate-limit en trivy-fs: instalamos Trivy por apt y
      # skip-setup-trivy en cada paso; el token es para el pull de la DB.
      TRIVY_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Instalar Trivy (repo apt oficial de Aqua — evita el rate-limit del instalador)
        # ROBUSTEZ (2026-08-18): timeout por comando + reintentos.
        # Sin esto, un mirror de apt que se atasca deja el job COLGADO hasta el timeout de
        # 6 h de Actions en lugar de fallar. Ocurrió 4 veces en una sola noche (trivy-fs ×2,
        # trivy-image, y el `playwright install` de e2e): 25 min parados en `apt-get`, sin
        # log ni señal. Es especialmente dañino aquí porque Railway espera al CHECK SUITE
        # COMPLETO: un job colgado bloquea el deploy indefinidamente y parece "aún corriendo".
        # `timeout` acota cada comando, 3 intentos absorben el fallo transitorio, y
        # `timeout-minutes` es el tope duro del step.
        # El gate NO se relaja: si tras 3 intentos no hay Trivy, el step FALLA (exit 1).
        # Nunca se continúa sin escanear.
        # CORRECCIÓN (2026-08-18, misma noche): la primera versión de este bloque reintentaba
        # sin soltar el lock. `timeout` mata apt A MITAD de la descarga y el proceso huérfano
        # CONSERVA /var/lib/dpkg/lock-frontend, así que los intentos 2 y 3 morían al instante
        # con "Could not get lock ... It is held by process N" — reintentos inútiles contra un
        # lock que el propio timeout dejaba tomado. `liberar_apt` lo suelta antes de reintentar.
        timeout-minutes: 20
        run: |
          set -uo pipefail
          liberar_apt() {
            sudo pkill -x apt-get 2>/dev/null || true
            sudo pkill -x dpkg 2>/dev/null || true
            for _ in $(seq 1 30); do
              sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
              sleep 2
            done
            sudo dpkg --configure -a >/dev/null 2>&1 || true
          }
          instalar_trivy() {
            sudo timeout 240 apt-get update -o Acquire::Retries=3 || return 1
            sudo timeout 240 apt-get install -y wget gnupg || return 1
            wget -qO - --timeout=30 --tries=3 https://aquasecurity.github.io/trivy-repo/deb/public.key \
              | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null || return 1
            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
              | sudo tee /etc/apt/sources.list.d/trivy.list || return 1
            sudo timeout 240 apt-get update -o Acquire::Retries=3 || return 1
            sudo timeout 300 apt-get install -y trivy || return 1
          }
          for intento in 1 2 3; do
            if instalar_trivy; then
              trivy --version
              exit 0
            fi
            echo "::warning title=Instalacion de Trivy fallida::Intento $intento agotado o fallido; liberando lock de apt y reintentando."
            liberar_apt
            sleep 10
          done
          echo "::error title=No se pudo instalar Trivy::3 intentos agotados. El gate NO se salta: el job falla."
          exit 1
      - name: Build + scan imagen backend
        if: hashFiles('backend/package.json') != ''
        run: |
          docker build -f Dockerfile.backend -t tcg-backend:scan --target runtime .
      - name: Trivy image backend
        if: hashFiles('backend/package.json') != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: "true"
          scan-type: image
          image-ref: tcg-backend:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: table
          # Sin excepciones activas: los CVE de node-pkg que reportaba este scan
          # venían del npm empaquetado en `node:20-alpine`
          # (/usr/local/lib/node_modules/npm/node_modules/...), NO de deps de la
          # app. Dockerfile.backend elimina npm/npx de la etapa `runtime`, así que
          # esa superficie desapareció en vez de ignorarse. Todo bloquea.
          trivyignores: security/.trivyignore
      - name: Build + scan imagen frontend
        if: hashFiles('frontend/package.json') != ''
        run: |
          docker build -f Dockerfile.frontend -t tcg-frontend:scan --target runtime \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:3001/api/v1 \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_scan \
            --build-arg NEXT_PUBLIC_DEFAULT_LOCALE=es \
            --build-arg NEXT_PUBLIC_USE_MOCKS=false .
      - name: Trivy image frontend
        if: hashFiles('frontend/package.json') != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: "true"
          scan-type: image
          image-ref: tcg-frontend:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          format: table
          # Mismo criterio que el backend: sin excepciones activas. La etapa
          # `runtime` de Dockerfile.frontend también borra npm/npx de la imagen
          # base (el runtime standalone de Next arranca con `node server.js`).
          trivyignores: security/.trivyignore

  # ---------------------------------------------------------------------------
  # Gate final SAST.
  # ---------------------------------------------------------------------------
  sast-ok:
    needs: [semgrep, gitleaks, npm-audit, trivy-fs, trivy-image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resumen
        run: |
          echo "semgrep:     ${{ needs.semgrep.result }}"
          echo "gitleaks:    ${{ needs.gitleaks.result }}"
          echo "npm-audit:   ${{ needs.npm-audit.result }}"
          echo "trivy-fs:    ${{ needs.trivy-fs.result }}"
          echo "trivy-image: ${{ needs.trivy-image.result }}"
          for r in "${{ needs.semgrep.result }}" "${{ needs.gitleaks.result }}" \
                   "${{ needs.npm-audit.result }}" "${{ needs.trivy-fs.result }}" \
                   "${{ needs.trivy-image.result }}"; do
            if [ "$r" = "failure" ]; then
              echo "::error::Un job SAST falló (high/critical). Revisa los logs."
              exit 1
            fi
          done
          echo "SAST OK."
