# =============================================================================
# e2e-real.yml — E2E en modo REAL (backend + DB + Redis reales)  ·  devops
# TCG Vault MX — Marketplace TCG con Bóveda (Pokémon, México)
# =============================================================================
# PROBLEMA QUE RESUELVE (Paso 5 sistémico):
#   Hoy la suite Playwright "verde" corre contra MOCKS (NEXT_PUBLIC_USE_MOCKS=true,
#   webServer del playwright.config levanta Next con fixtures). Por eso "QA verde"
#   convivió con flujos reales rotos (stubs de comprar/retirar se colaron hasta que
#   se cablearon los endpoints). Este workflow hace que "verde" signifique
#   "funciona de verdad": levanta el STACK REAL (Postgres 16 + Redis 7 + MinIO +
#   backend NestJS + frontend con NEXT_PUBLIC_USE_MOCKS=false) y corre un SMOKE de
#   los flujos críticos de PROJECT.md contra endpoints reales:
#     - comprar -> orden                 (checkout.spec.ts)
#     - comprar como INVITADO -> pedido  (guest-checkout.spec.ts)   <- añadido 2026-08-24
#     - retirar -> envío                 (shipments.spec.ts)
#     - vender/buylist -> solicitud      (buylist.spec.ts)
#
# LOS TRES FLUJOS DE DINERO (2026-08-24, decisión del dueño — DEVOPS_NOTES §31):
#   El dueño eligió verificar comprar · comprar-como-invitado · retirar EN NAVEGADOR
#   antes de desplegar, con clave de PRUEBA de Stripe (no aceptación formal). Faltaba
#   `guest-checkout.spec.ts` en el smoke: el gate cubría dos de los tres. Ya está.
#   Los tres necesitan un proveedor de pago REAL: sin `sk_test_…` válido el backend
#   responde 503 PAYMENT_PROVIDER_UNAVAILABLE y libera la reserva (money-safe).
#
# CORRECCIÓN 2026-08-30 — EL PREFLIGHT MENTÍA, Y ESTE WORKFLOW LLEVABA 13/13 ROJOS
# (DEVOPS_NOTES §33). Dos defectos distintos, arreglados a la vez:
#
#   (a) FALSO VERDE DEL PREFLIGHT. El paso «¿hay clave de PRUEBA real?» comparaba
#       contra el literal `sk_test_e2e_dummy` y nada más: comprobaba PRESENCIA, no
#       VALIDEZ. Con el fallback puesto imprimía… bueno, el fallback lo cazaba; pero
#       cualquier otro relleno con prefijo correcto (`sk_test_CHANGE_ME`, el valor que
#       copie alguien del .env.example) pasaba por la rama `sk_test_*` y anunciaba en
#       VERDE «los smokes de dinero son gate real». Ahora la clasificación es POR FORMA
#       (prefijo + longitud + alfabeto + palabras de relleno) y vive en un script
#       probable a mano: `scripts/stripe-test-key-preflight.sh`.
#
#   (b) ROJO DIARIO POR UNA DECISIÓN CONSCIENTE. El dueño NO ha configurado Stripe
#       A PROPÓSITO y no lo hará hasta que la plataforma esté al 100%. Con los tres
#       smokes de dinero obligatorios siempre, el nightly moría 3-failed/1-passed cada
#       noche desde el primer día (13 corridas, 13 rojos, ninguna mirada). Un rojo que
#       sale siempre no es una alarma: es ruido, y el ruido es exactamente lo que hizo
#       que nadie viera el tablero. Ahora, SIN credencial utilizable, los tres se
#       SALTAN de forma declarada —«no ejecutados, NO aprobados»— y el resto del E2E
#       real vuelve a ser señal. La decisión y su porqué: DEVOPS_NOTES §33.2.
#
#   Lo que NO cambia, y es la mitad que sostiene la honestidad de (b):
#     · Los tres specs siguen en `SMOKE_SPECS`, sin `.skip`, sin tocar `frontend/e2e/`.
#       El salto lo decide el ENTORNO en tiempo de corrida, no el código fuente.
#     · En cuanto los secrets existan con forma de credencial, los tres corren y son
#       OBLIGATORIOS sin que nadie quite ninguna bandera. No hay interruptor que
#       alguien tenga que acordarse de apagar (ese es el patrón que ya nos mordió).
#     · La ruta de promoción a prod (`require_real_stripe: true`, deploy.yml) NO salta
#       nada: ahí la falta de credencial es un ROJO INMEDIATO, en el segundo 0.
#
# E2E_REAL=1 EN EL PASO DE PLAYWRIGHT (2026-08-24):
#   Antes este workflow fijaba `E2E_BASE_URL` y NO `E2E_REAL`. Con el helper viejo
#   (`IS_REAL = E2E_REAL === '1'`) eso significaba que el gate «real» autenticaba con
#   el token inventado 'mock.session.token'. Frontend ya arregló el helper (ahora
#   `E2E_BASE_URL` implica auth real), así que el gate quedó correcto SIN tocar este
#   archivo — pero se fija `E2E_REAL=1` igualmente por dos razones verificadas:
#     1. `guest-checkout.spec.ts:151` ramifica con `process.env.E2E_REAL` CRUDO, no
#        con `IS_REAL`. Sin la bandera toma la rama MOCK de sus asertos (clic dentro
#        del modal + copy de confirmación simulada) contra un modal de Stripe REAL.
#     2. Alinea las tres preguntas en una sola respuesta: qué specs corro, contra qué
#        habla la app y cómo autentico. Es el criterio de DEVOPS_NOTES §30.1.
#
# SEPARACIÓN mock vs real:
#   - MOCK (rápido, feedback de PR): job `frontend-e2e` de e2e.yml (webServer del
#     config, sin docker). Corre en cada push/PR.
#   - REAL (gate previo a prod / nightly): ESTE workflow. Se invoca:
#       * nightly (schedule),
#       * a mano (workflow_dispatch),
#       * como paso previo a promover a prod desde deploy.yml (workflow_call).
#
# NAVEGADOR (fix 2026-08-17): el job corre en `ubuntu-latest`, un runner ESTÁNDAR
#   de GitHub. No existe ningún /opt/pw-browsers ahí (esa ruta solo la tiene el
#   runner-harness local), así que la política anterior de "Chromium preinstalado,
#   sin playwright install" hacía fallar el job siempre. Ahora se instala el
#   navegador en el propio job con `npx playwright install --with-deps chromium`,
#   justo después del `npm ci` del frontend (el CLI vive en frontend/node_modules).
#
# NO reescribe la suite: los .spec los escriben frontend/backend (CLAUDE.md). Este
# workflow solo los EJECUTA en modo real. La selección del smoke es parametrizable
# (input `smoke_specs`) para no acoplarse a nombres de archivo.
# =============================================================================

name: E2E real (stack real)

on:
  # Nightly: 08:00 UTC = 02:00 CDMX. "Verde de verdad" cada noche.
  schedule:
    - cron: "0 8 * * *"
  # Disparo manual.
  workflow_dispatch:
    inputs:
      smoke_specs:
        description: "Specs de smoke a correr (relativos a frontend/e2e, separados por espacio)"
        type: string
        default: "checkout.spec.ts guest-checkout.spec.ts shipments.spec.ts buylist.spec.ts"
  # Invocable desde deploy.yml como gate previo a producción.
  workflow_call:
    inputs:
      smoke_specs:
        description: "Specs de smoke a correr (relativos a frontend/e2e, separados por espacio)"
        type: string
        required: false
        default: "checkout.spec.ts guest-checkout.spec.ts shipments.spec.ts buylist.spec.ts"
      require_real_stripe:
        description: "Exigir STRIPE_TEST_SECRET_KEY real (sk_test_…). La ruta de PROMOCIÓN a prod lo pone en true."
        type: boolean
        required: false
        default: false
    outputs:
      # Para que un caller (deploy.yml) pueda distinguir «verde con gate de dinero»
      # de «verde sin gate de dinero» SIN leer logs. Hoy nadie lo consume: cablearlo
      # en deploy.yml es decisión del coordinador con el dueño (DEVOPS_NOTES §33.4).
      money_gate:
        description: "on = los 3 smokes de dinero se ejecutaron; off = se saltaron por falta de credencial de Stripe."
        value: ${{ jobs.e2e-real.outputs.money_gate }}
      skipped_specs:
        description: "Specs de dinero saltados por falta de credencial (vacío si money_gate=on)."
        value: ${{ jobs.e2e-real.outputs.skipped_specs }}

concurrency:
  group: e2e-real-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-real:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      money_gate: ${{ steps.stripe.outputs.money_gate }}
      skipped_specs: ${{ steps.stripe.outputs.skipped_specs }}
    env:
      # El compose de staging ya hornea NEXT_PUBLIC_USE_MOCKS=false en el frontend.
      COMPOSE: docker-compose.staging.yml
      # Puertos del stack de staging (ver docker-compose.staging.yml).
      FRONTEND_URL: http://localhost:3010
      BACKEND_HEALTH: http://localhost:3011/api/v1/health
      # Smoke por defecto (workflow_call/dispatch lo pueden sobreescribir).
      SMOKE_SPECS: ${{ inputs.smoke_specs || 'checkout.spec.ts guest-checkout.spec.ts shipments.spec.ts buylist.spec.ts' }}
      # Los specs que EXIGEN proveedor de pago real (abren el modal de Stripe). Fuente
      # única de verdad, leída por scripts/stripe-test-key-preflight.sh. NO es una lista
      # de "tests opcionales": es la lista de tests cuyo resultado depende de que exista
      # credencial. Si aparece un cuarto flujo de dinero, se añade aquí.
      MONEY_SPECS: "checkout.spec.ts guest-checkout.spec.ts shipments.spec.ts"
      # ---------------------------------------------------------------------
      # INCAPACITACIÓN FRENTE AL PROVEEDOR DE PAGA (ARCHITECTURE §4.38r.6.1)
      #
      # Desde v1.51 (M-48) hay UN SOLO dial: el `PUT /admin/settings
      # {"gradingHookEnabled":"on"}` que el arnés E2E hace EN CADA CORRIDA ya no
      # solo publica cifras — autoriza al barrido a pedir datos a
      # PokemonPriceTracker (2 créditos/carta) y a escribir precios estimados.
      # Sin estas dos líneas, este gate sería un consumidor silencioso de la
      # cuota de un proveedor de paga.
      #
      # (1) La credencial va DECLARADA VACÍA, no omitida. Hasta hoy no estaba en
      #     ningún workflow y eso parecía suficiente: no lo era. `docker-compose`
      #     la interpola del entorno del runner, así que «no está» dependía de
      #     que nadie la exportara. Declararla vacía convierte el día que alguien
      #     quiera meterla en un cambio VISIBLE en el diff de este archivo.
      #     Con la llave vacía, el proveedor sale con `warn` ANTES de la primera
      #     petición: cero peticiones, cero escrituras, cero créditos.
      # (2) La constancia de devops: cuando la API bajo prueba no corre en este
      #     runner (staging), su entorno NO es observable desde aquí y el
      #     guardarraíl del arnés (frontend/e2e/utils/paid-provider-guard.ts) se
      #     NIEGA a encender el dial sin esta firma. La firma devops porque es
      #     quien conoce ese entorno — y NO gana sobre la observación: contra un
      #     backend local con llave viva, declararla no desbloquea nada.
      # Verificado en CI por scripts/check-e2e-provider-incapacitation.sh (primer
      # paso de este job). DEVOPS_NOTES §32.12.
      # ---------------------------------------------------------------------
      POKEMONPRICETRACKER_API_KEY: ''
      E2E_GRADING_PROVIDER_INCAPACITATED: '1'
      # Stripe SIEMPRE en modo TEST en staging/E2E (nunca claves live).
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY || 'sk_test_e2e_dummy' }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY || 'pk_test_e2e_dummy' }}
      STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET || 'whsec_e2e_dummy' }}
    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # GUARDA DE DINERO Nº0 — antes que el preflight de Stripe, porque este no
      # necesita ni red: verifica que el YAML declare la incapacitación frente al
      # proveedor de PAGA (§4.38r.6.1). Es estática a propósito. El guardarraíl
      # vivo del arnés ya existe (frontend); esto impide que alguien lo deje sin
      # su mitad de devops con un `env:` mal puesto y lo descubra en la factura.
      # -----------------------------------------------------------------------
      - name: Guarda — el entorno E2E no puede escribir contra el proveedor de paga
        run: ./scripts/check-e2e-provider-incapacitation.sh

      # -----------------------------------------------------------------------
      # PREFLIGHT DE STRIPE — EL PRIMER PASO, ANTES DE CONSTRUIR NADA.
      #
      # Antes vivía en el paso 11, después de `docker compose up --build` y de
      # `playwright install`: el job tardaba ~6 minutos en morir por algo que se
      # sabía en el segundo 0. Y sobre todo, juzgaba por PRESENCIA («¿la variable
      # está?») y no por VALIDEZ («¿esto es una credencial?»), que es lo que lo
      # convertía en un falso verde dentro de la puerta de promoción a prod.
      #
      # La lógica vive en scripts/stripe-test-key-preflight.sh y no en un `case`
      # incrustado aquí por una razón concreta: un `run:` de YAML no se puede
      # ejecutar a mano, y un detector que nadie puede probar es exactamente el
      # tipo de detector que se rompe en silencio. El script se prueba en local
      # con una variable de entorno y devuelve el mismo veredicto que en CI.
      # -----------------------------------------------------------------------
      - name: Preflight Stripe — clasificar las claves de PRUEBA por su FORMA
        id: stripe
        env:
          # En `schedule`/`workflow_dispatch` el contexto `inputs` no trae la clave:
          # se resuelve a 'false' (nightly => se salta el dinero). En la llamada de
          # deploy.yml llega 'true' (promoción => rojo inmediato si falta).
          REQUIRE_REAL_STRIPE: ${{ inputs.require_real_stripe && 'true' || 'false' }}
        run: ./scripts/stripe-test-key-preflight.sh

      - name: Guard scripts E2E — frontend debe exponer test:e2e
        run: |
          if ! node -e "process.exit(require('./frontend/package.json').scripts?.['test:e2e']?0:1)"; then
            echo "::error::frontend/package.json no expone 'test:e2e'. Lo cabla el rol frontend (CLAUDE.md)."
            exit 1
          fi
          if ! node -e "process.exit(require('./backend/package.json').scripts?.['seed:synthetic']?0:1)"; then
            echo "::warning::backend no expone 'seed:synthetic'; el seed sintético se saltará (--if-present). Flujos que dependan de datos sembrados pueden fallar (finding -> backend)."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # -----------------------------------------------------------------------
      # 1) Levantar el STACK REAL (mocks=false ya horneado en el frontend).
      #    El backend corre `prisma migrate deploy` al arrancar (Dockerfile CMD).
      # -----------------------------------------------------------------------
      # -----------------------------------------------------------------------
      # SEC-OPS-1 — se marca el instante ANTES de levantar nada. Todo lo que
      # responda después tiene que haber NACIDO después de esta marca; si no, es
      # un resto de otra corrida y lo que midamos no habla de este commit.
      # (docs/SECURITY_NOTES.md §9 · DEVOPS_NOTES §38)
      # -----------------------------------------------------------------------
      - name: Marcar el instante de arranque (procedencia del binario)
        run: |
          echo "STACK_UP_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          echo "Commit bajo prueba: $GITHUB_SHA"

      - name: Levantar stack real (Postgres/Redis/MinIO + backend + frontend)
        run: docker compose -f "$COMPOSE" --profile apps up -d --build

      - name: Esperar salud del backend (migrate deploy + API escuchando)
        run: |
          for i in $(seq 1 60); do
            if curl -sf "$BACKEND_HEALTH" >/dev/null 2>&1; then
              echo "Backend arriba ($BACKEND_HEALTH)."; exit 0
            fi
            echo "Esperando backend... ($i)"; sleep 5
          done
          echo "::error::El backend real no respondió en $BACKEND_HEALTH tras ~5min. Revisa arranque/migrate. Si es fallo de arranque del backend, el finding es del rol backend."
          docker compose -f "$COMPOSE" logs --tail=200 backend || true
          exit 1

      # -----------------------------------------------------------------------
      # GATE DE PROCEDENCIA — SEC-OPS-1. Aquí el riesgo es MENOR que en local
      # (`up -d --build` reconstruye desde el checkout en cada corrida, así que la
      # estrategia «reconstruir siempre» ya está puesta), pero «menor» no es
      # «nulo»: un contenedor superviviente de otra corrida, un `--build` que
      # falla y deja el anterior en pie, o un runner reutilizado, dan exactamente
      # el mismo verde falso que se comió el gate de seguridad DOS veces en local.
      # Se COMPRUEBA en vez de suponerse, y se deja dicho en el log qué commit se
      # está midiendo — que es la mitad del arreglo.
      # -----------------------------------------------------------------------
      - name: Gate SEC-OPS-1 — el backend vivo nació de ESTE arranque
        run: |
          ./scripts/assert-serving-head.sh \
            --url "$BACKEND_HEALTH" \
            --label "backend (compose, commit $GITHUB_SHA)" \
            --newer-than "$STACK_UP_EPOCH" \
            --remedy "El contenedor que responde es ANTERIOR a este job: hay un stack superviviente. Bájalo (docker compose -f $COMPOSE down -v) y repite. NO interpretes el resultado de esta corrida."
          {
            echo "### Procedencia del stack E2E"
            echo ""
            echo "- commit medido: \`$GITHUB_SHA\`"
            echo "- backend levantado por este job (verificado contra \`uptime\` de /health)"
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # 2) Migraciones (idempotentes al arranque) + SEED SINTÉTICO.
      #    Corre DENTRO del contenedor backend (tiene ts-node + prisma + DATABASE_URL
      #    de staging). Sin fallback en el runner (enmascararía el error real).
      # -----------------------------------------------------------------------
      # OJO (2026-08-17): el contenedor backend YA NO TIENE npm — Dockerfile.backend
      # borra npm/npx de la etapa `runtime` (los CVE HIGH/CRITICAL de node-pkg que
      # bloqueaban trivy-image venían del npm de la imagen base). Así que no se puede
      # usar `npm run seed:synthetic --if-present`. Se lee el script de package.json
      # (misma fuente de verdad, sin hardcodear la ruta del seed, que es del rol
      # backend) y se ejecuta con node_modules/.bin en el PATH. Semántica idéntica,
      # incluido el "si no existe, se salta".
      - name: Seed sintético (datos deterministas para los flujos)
        run: |
          SEED_CMD="$(docker compose -f "$COMPOSE" exec -T backend \
            node -e "process.stdout.write((require('./package.json').scripts||{})['seed:synthetic']||'')")"
          if [ -z "$SEED_CMD" ]; then
            echo "::warning::backend no expone 'seed:synthetic'; se salta el seed (equivalente a --if-present)."
            exit 0
          fi
          echo "Seed sintético: $SEED_CMD"
          docker compose -f "$COMPOSE" exec -T backend \
            sh -c "export PATH=/app/node_modules/.bin:\$PATH; $SEED_CMD"

      # -----------------------------------------------------------------------
      # PARIDAD DEL PROVEEDOR DE PRECIO (`I-PP5`, API_CONTRACT §M10-PP).
      #
      # Va DESPUÉS del seed a propósito: el seed MATERIALIZA la fila
      # `ConfigSetting.price_provider` (`upsert(... update:{})`), así que antes de
      # él no hay nada que corregir y después de él la fila ya existe.
      #
      # QUÉ SE EVITA, medido: mientras el seed del código no sea el proveedor
      # PRIMARIO (`D-PP-1`, backend), este stack nace en el LEGACY — que no es
      # inerte: barre y escribe precios APLANADOS (mismo `market` a normal /
      # reverse_holo / holofoil). Un smoke verde contra ese barrido no dice nada
      # del que se promueve a producción (ARCHITECTURE §4.35a(d)).
      #
      # ⛔ NO se hace con una env var: `PRICE_PROVIDER` en el entorno NO flipea el
      # dial (DEVOPS_NOTES §23.8, verificado en `providerFor()`), y «fijarlo» ahí
      # dejaría este workflow mintiendo.
      #
      # ROJO DURO: si el dial no queda en el primario, este job para. Un E2E que
      # mide otro sistema es peor que no correrlo, porque su verde se cita.
      #
      # RETIRO DE `--ensure` (2026-09-10, DEVOPS_NOTES §45.1). Aquí había
      # `--ensure`, el puente INTERINO de `D-PP-2`. `D-PP-1` aterrizó (46d76cc):
      # el seed del código ya es el primario, así que el puente caducó — y desde
      # ese día `--ensure` era un **no-op que salía 0 sin mirar nada**. O sea que
      # este paso, anunciado como «rojo duro», llevaba desde entonces sin
      # verificar absolutamente nada. Cambiarlo a `--assert` no es una rebaja:
      # es lo contrario, DEVUELVE la verificación que el no-op se había comido.
      #
      # Este stack nace FRESCO en cada corrida (`down -v` al final del job), así
      # que el seed primario basta y `--assert` pasa solo — verificado en el run
      # 34440267283, donde el mismo `--assert` corre contra este mismo compose.
      # Si algún día sale rojo, el hallazgo es del rol **backend** (su seed dejó
      # de fijar el primario); NO se parchea desde devops.
      # -----------------------------------------------------------------------
      - name: Paridad del dial price_provider (I-PP5) — el smoke mide el barrido que se promueve
        run: |
          ./scripts/price-provider-parity.sh --assert --api-base "http://localhost:3011/api/v1"
          {
            echo "### Proveedor de precio del stack E2E"
            echo ""
            echo "- dial \`price_provider\` verificado contra el PRIMARIO (\`I-PP5\`, API_CONTRACT §M10-PP)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Esperar readiness del frontend real
        run: |
          for i in $(seq 1 40); do
            if curl -sf "$FRONTEND_URL/es" >/dev/null 2>&1; then
              echo "Frontend real arriba ($FRONTEND_URL/es, NEXT_PUBLIC_USE_MOCKS=false)."; exit 0
            fi
            echo "Esperando frontend... ($i)"; sleep 5
          done
          echo "::error::El frontend real no respondió en $FRONTEND_URL/es tras ~3min."
          docker compose -f "$COMPOSE" logs --tail=200 frontend || true
          exit 1

      # -----------------------------------------------------------------------
      # 3) Playwright SMOKE contra el frontend REAL (E2E_BASE_URL fijado => el
      #    playwright.config NO levanta su webServer mock; pega al stack real).
      # -----------------------------------------------------------------------
      - name: Install deps frontend
        working-directory: frontend
        run: npm ci

      # Chromium para el runner estándar de GitHub. Va DESPUÉS del `npm ci`: el CLI
      # `playwright` vive en frontend/node_modules. `--with-deps` instala las libs
      # de sistema que Chromium necesita.
      #
      # PLAYWRIGHT_CHROMIUM_PATH es OBLIGATORIO aquí: frontend/playwright.config.ts
      # (rol frontend) fija `executablePath = PLAYWRIGHT_CHROMIUM_PATH ??
      # '/opt/pw-browsers/chromium'`, ruta del runner-harness que no existe en
      # ubuntu-latest. Se resuelve con la API oficial de Playwright.
      - name: Instalar Chromium de Playwright
        working-directory: frontend
        # ROBUSTEZ (2026-08-18): ver la nota extendida en security-sast.yml. `--with-deps`
        # ejecuta `apt-get` por dentro, y un mirror atascado deja el job colgado en vez de
        # fallar. timeout + 3 intentos.
        # CORRECCIÓN (2026-08-18, misma noche): ver la nota extendida en security-sast.yml.
        # `timeout` mata apt a mitad de la descarga y el proceso huérfano CONSERVA el lock de
        # dpkg -> los reintentos morían al instante con "Could not get lock".
        timeout-minutes: 25
        run: |
          set -uo pipefail
          liberar_apt() {
            sudo pkill -x apt-get 2>/dev/null || true
            sudo pkill -x dpkg 2>/dev/null || true
            for _ in $(seq 1 30); do
              sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
              sleep 2
            done
            sudo dpkg --configure -a >/dev/null 2>&1 || true
          }
          for intento in 1 2 3; do
            if timeout 420 npx playwright install --with-deps chromium; then
              break
            fi
            if [ "$intento" = "3" ]; then
              echo "::error title=No se pudo instalar Chromium::3 intentos agotados."
              exit 1
            fi
            echo "::warning title=Instalacion de Chromium fallida::Intento $intento agotado o fallido; liberando lock de apt y reintentando."
            liberar_apt
            sleep 10
          done
          CHROMIUM_BIN="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          if [ ! -x "$CHROMIUM_BIN" ]; then
            echo "::error title=Chromium no quedó instalado::No existe/ejecutable: $CHROMIUM_BIN"
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_PATH=$CHROMIUM_BIN" >> "$GITHUB_ENV"
          echo "Chromium instalado: $CHROMIUM_BIN"

      # `EFFECTIVE_SMOKE_SPECS` lo fija el preflight: es `SMOKE_SPECS` tal cual cuando
      # hay credencial de Stripe utilizable, y `SMOKE_SPECS` MENOS los de dinero cuando
      # no la hay. Nunca al revés: el preflight no añade specs, sólo declara cuáles no
      # se pueden probar hoy y por qué. Si no quedara ninguno, el preflight ya habrá
      # abortado (un job vacío en verde sería el mismo falso verde con otra cara).
      - name: Playwright smoke — flujos críticos (REAL)
        id: smoke
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ env.FRONTEND_URL }}
          # Alinea selección de specs, rama de asertos y autenticación. Ver cabecera.
          E2E_REAL: '1'
        run: |
          echo "Smoke (real) specs: $EFFECTIVE_SMOKE_SPECS"
          echo "Gate de dinero: $MONEY_GATE${MONEY_SKIPPED:+  ·  SALTADOS: $MONEY_SKIPPED}"
          # shellcheck disable=SC2086
          npm run test:e2e -- $EFFECTIVE_SMOKE_SPECS

      # -----------------------------------------------------------------------
      # VEREDICTO EN UNA LÍNEA, EN LA PÁGINA DEL RUN.
      # Requisito explícito: el estado «Stripe no configurado» tiene que ser de
      # primera clase y legible SIN abrir logs. Hoy había que bajar 2 000 líneas
      # para descubrir que la clave era de relleno. Esto sale en el *Summary* del
      # run (primer bloque que se ve) y además como anotación.
      # -----------------------------------------------------------------------
      - name: Veredicto del run — qué se probó y qué NO
        if: always()
        env:
          PW_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          set -uo pipefail
          CORRIDOS=$(printf '%s' "${EFFECTIVE_SMOKE_SPECS:-}" | wc -w | tr -d ' ')
          SALTADOS=$(printf '%s' "${MONEY_SKIPPED:-}" | wc -w | tr -d ' ')
          [ "$CORRIDOS" = "1" ] && PLURAL="flujo" || PLURAL="flujos"
          case "${PW_OUTCOME:-skipped}" in
            success) ESTADO="PASARON" ;;
            failure) ESTADO="FALLARON" ;;
            *)       ESTADO="NO LLEGARON A CORRER (el job murió antes)" ;;
          esac
          {
            echo ""
            echo "## Veredicto del E2E real"
            echo ""
            if [ "${MONEY_GATE:-}" = "on" ]; then
              echo "**Corrió $CORRIDOS $PLURAL · saltó 0 · gate de dinero ACTIVO.** Los smokes de dinero $ESTADO."
            elif [ "${MONEY_GATE:-}" = "off" ]; then
              echo "**Corrió $CORRIDOS $PLURAL · saltó $SALTADOS por credencial de Stripe ausente (decisión del dueño, DEVOPS_NOTES §33.2).** Los flujos ejecutados $ESTADO."
              echo ""
              echo "| | |"
              echo "|---|---|"
              echo "| Ejecutados | \`${EFFECTIVE_SMOKE_SPECS:-}\` |"
              echo "| **Saltados — no ejecutados, NO aprobados** | \`${MONEY_SKIPPED:-}\` |"
              echo "| Qué NO cubre este verde | comprar · comprar-como-invitado · retirar |"
              echo "| Cómo se activan | crear los secrets \`STRIPE_TEST_SECRET_KEY\` + \`STRIPE_TEST_PUBLISHABLE_KEY\` (§31.1). **Nada más que tocar: no hay bandera que quitar.** |"
            else
              echo "**El preflight abortó: no se ejecutó ningún smoke.** Ver el bloque de arriba."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${MONEY_GATE:-}" = "off" ]; then
            echo "::warning title=Verde PARCIAL — $CORRIDOS $PLURAL corridos, $SALTADOS de dinero SALTADOS::Este run NO probó comprar, comprar-como-invitado ni retirar: no hay credencial de Stripe (ausencia deliberada, DEVOPS_NOTES 33.2). El verde de este workflow NO es un verde de dinero."
          fi

      # -----------------------------------------------------------------------
      # QUE EL HUECO SE VEA SIN ABRIR NADA (§46.4) — 2026-09-10.
      #
      # El problema que queda cuando falta la clave de Stripe NO es que el aviso
      # no exista: existe, y es bueno (tabla en el step summary + `::warning`).
      # El problema es que el run TERMINA VERDE y en la LISTA de Actions se ve
      # idéntico a uno que sí midió el dinero. Quien pasa revista a diez runs no
      # abre diez step summaries: mira diez puntos verdes.
      #
      # Un artefacto SÍ se ve en la portada del run, junto al reporte. Se llama
      # como lo que falta, en mayúsculas, para que sea imposible leerlo como
      # «pasó». No cambia el veredicto —la decisión del dueño (§33.2) se respeta
      # tal cual— sólo lo hace IMPOSIBLE DE CONFUNDIR.
      #
      # ⚠️ Esto NO sustituye a la clave: mientras no exista el secret, comprar,
      # comprar-como-invitado y retirar siguen SIN MEDIR. Es una petición al
      # dueño, no un problema de infraestructura (DEVOPS_NOTES §31.1, §46.4).
      # -----------------------------------------------------------------------
      - name: Escribir el marcador del hueco de dinero
        if: always() && env.MONEY_GATE == 'off'
        run: |
          mkdir -p /tmp/hueco-dinero
          {
            echo "# ESTE RUN NO MIDIÓ NINGÚN FLUJO DE DINERO"
            echo
            echo "El job terminó **verde**. Ese verde NO cubre:"
            echo
            echo "  - comprar (checkout.spec.ts)"
            echo "  - comprar como invitado (guest-checkout.spec.ts)"
            echo "  - retirar / envíos (shipments.spec.ts)"
            echo
            echo "No se ejecutaron. **No están aprobados.** No hay evidencia de que funcionen."
            echo
            echo "Motivo: no hay credencial de PRUEBA de Stripe en este repositorio."
            echo "Se saltan a propósito (DEVOPS_NOTES 33.2) en vez de correr un job vacío"
            echo "en verde, que sería un falso verde. Saltarlos es lo correcto; lo que NO"
            echo "es correcto es leer este run como si el dinero estuviera probado."
            echo
            echo "## Cómo desaparece este fichero"
            echo
            echo "Crear los secrets en Settings > Secrets and variables > Actions:"
            echo "  - STRIPE_TEST_SECRET_KEY       (sk_test_...)"
            echo "  - STRIPE_TEST_PUBLISHABLE_KEY  (pk_test_...)"
            echo
            echo "Nada más que tocar: no hay bandera que quitar. Nunca una clave live."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Commit: ${GITHUB_SHA}"
          } > /tmp/hueco-dinero/LEEME-EL-DINERO-NO-SE-PROBO.md

      - name: Subir el marcador del hueco de dinero
        if: always() && env.MONEY_GATE == 'off'
        uses: actions/upload-artifact@v4
        with:
          # El NOMBRE es el mensaje: aparece en la portada del run, en la lista
          # de artefactos, sin abrir un solo log.
          name: SIN-MEDIR-comprar-invitado-retirar
          path: /tmp/hueco-dinero
          if-no-files-found: warn
          retention-days: 14

      - name: Subir reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Logs del stack si algo falló
        if: failure()
        run: docker compose -f "$COMPOSE" logs --tail=300

      - name: Apagar stack
        if: always()
        run: docker compose -f "$COMPOSE" --profile apps down -v
