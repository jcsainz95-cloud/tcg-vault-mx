# =============================================================================
# money-gap-nag.yml — «el dinero sigue SIN MEDIR»  ·  devops
# TCG Vault MX — Marketplace TCG con Bóveda (Pokémon, México)
# =============================================================================
# QUÉ BLOQUEA HOY EL RELEASE (medido, no supuesto)
# ---------------------------------------------------------------------------
# QA aprobó el candidato como gate de WORK STREAM y lo RECHAZÓ como gate de
# RELEASE por un motivo único: **los tres flujos de dinero no se han ejecutado
# nunca**. Comprar, comprar-como-invitado y retirar/enviar se saltan en cada run
# de `e2e-real.yml` porque este repositorio no tiene `STRIPE_TEST_SECRET_KEY` ni
# `STRIPE_TEST_PUBLISHABLE_KEY`. La condición que QA puso para el veredicto de
# release es literal: correr `e2e-real.yml` con esos secrets y citar ese run.
#
# No es un problema de infraestructura: el cable está puesto y probado
# (DEVOPS_NOTES §31.1, §33.2, §46.4). Es una petición al DUEÑO del repositorio,
# y lleva tres pases sin respuesta.
#
# POR QUÉ ESTE WORKFLOW (y por qué es ROJO y no un aviso)
# ---------------------------------------------------------------------------
# Ya hay dos avisos, y los dos exigen que alguien vaya a mirar:
#   · el `::warning` + la tabla en el step summary de `e2e-real.yml`, que solo
#     lee quien abre ese run concreto;
#   · el artefacto `SIN-MEDIR-comprar-invitado-retirar` (§46.4), que se ve en la
#     portada del run… si alguien entra al run.
# Los dos comparten el defecto que este repo ya pagó caro en S-PROC-1, en el
# falso verde del DAST (§44) y en la paridad `I-PP5` (§48.1): **una señal que no
# cambia ningún desenlace la lee quien ya lo sabía**. Faltaba lo único que sale
# a buscar a la persona en vez de esperarla:
#   1. un ROJO periódico — GitHub notifica por sí solo los fallos de workflows
#      programados al dueño del repo, sin que nadie tenga que entrar;
#   2. un ISSUE con dueño e historial, que se comenta cada semana y se CIERRA
#      SOLO en cuanto los secrets existen.
# El coste de este rojo es CERO para el equipo: es `schedule`/`workflow_dispatch`,
# no puede ser required check, no hay PR ni deploy colgando de él. Mismo
# razonamiento, palabra por palabra, que el `deps-audit` de
# `security-scheduled.yml`.
#
# ⚠️ LO QUE ESTE WORKFLOW **NO** HACE: no mide dinero, no aprueba nada y no
# sustituye a la clave. Solo impide que el hueco se vuelva invisible por
# costumbre. Se apaga solo (verde y issue cerrado) el día que existan los
# secrets; si el dueño decide NO ponerlos, la salida correcta es registrar esa
# decisión en `docs/TECH_DEBT.md` y borrar este archivo — no silenciarlo.
#
# ⛔ NUNCA una clave `sk_live_…`. El preflight (`stripe-test-key-preflight.sh`)
#    aborta si huele a live, y este workflow no toca el valor del secret jamás:
#    solo comprueba si está PRESENTE (los secrets no se imprimen nunca).
# =============================================================================

name: Dinero SIN MEDIR (falta la clave de PRUEBA de Stripe)

on:
  schedule:
    - cron: "0 7 * * 1"    # lunes 07:00 UTC — una hora después del barrido de seguridad
  workflow_dispatch:

permissions:
  contents: read

jobs:
  money-gap:
    name: ¿Siguen sin medirse comprar / invitado / retirar?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write        # solo para abrir/actualizar/cerrar el issue del hueco
    env:
      TITLE: "[release] Dinero SIN MEDIR: faltan STRIPE_TEST_SECRET_KEY y STRIPE_TEST_PUBLISHABLE_KEY"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      E2E_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/e2e-real.yml
    steps:
      # ---------------------------------------------------------------------
      # PRESENCIA, NO VALOR. `secrets.X != ''` es lo único que se consulta. El
      # valor no se lee, no se imprime y no se pasa a ningún proceso: si la clave
      # está pero es basura, quien lo dirá es el preflight de `e2e-real.yml`
      # (`stripe-test-key-preflight.sh`), que ya distingue «ausente» de
      # «formato raro» de «live» — y que es el que manda.
      # ---------------------------------------------------------------------
      - name: ¿Existen los dos secrets?
        id: check
        env:
          HAS_SK: ${{ secrets.STRIPE_TEST_SECRET_KEY != '' }}
          HAS_PK: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY != '' }}
        run: |
          set -euo pipefail
          echo "STRIPE_TEST_SECRET_KEY presente:      ${HAS_SK}"
          echo "STRIPE_TEST_PUBLISHABLE_KEY presente: ${HAS_PK}"
          if [ "${HAS_SK}" = "true" ] && [ "${HAS_PK}" = "true" ]; then
            echo "gap=no" >> "$GITHUB_OUTPUT"
          else
            echo "gap=yes" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "| secret | estado |"
            echo "|---|---|"
            echo "| \`STRIPE_TEST_SECRET_KEY\` | $( [ "${HAS_SK}" = true ] && echo 'presente' || echo '**AUSENTE**' ) |"
            echo "| \`STRIPE_TEST_PUBLISHABLE_KEY\` | $( [ "${HAS_PK}" = true ] && echo 'presente' || echo '**AUSENTE**' ) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # HAY HUECO: portada del run + issue con dueño.
      # ---------------------------------------------------------------------
      - name: Resumen del hueco en la portada del run
        if: steps.check.outputs.gap == 'yes'
        run: |
          {
            echo ""
            echo "## Comprar · comprar como invitado · retirar: SIN EJECUTAR"
            echo ""
            echo "Estos tres flujos **no se han ejecutado nunca** contra un backend real."
            echo "No están aprobados y no hay evidencia de que funcionen. QA rechazó el"
            echo "veredicto de **release** por esto (el de work stream sí está aprobado)."
            echo ""
            echo "**Quién lo desbloquea:** el dueño del repositorio, en"
            echo "*Settings > Secrets and variables > Actions*, creando los dos secrets"
            echo "con claves de **PRUEBA** de Stripe (\`sk_test_…\` / \`pk_test_…\`)."
            echo "Nunca una clave live: el preflight la rechaza."
            echo ""
            echo "**Y después:** lanzar [\`e2e-real.yml\`](${E2E_URL}) con"
            echo "\`require_real_stripe = true\` y citar ese run en el veredicto de release."
            echo ""
            echo "_Este workflow no mide dinero ni aprueba nada: solo impide que el hueco"
            echo "se vuelva invisible por costumbre (DEVOPS_NOTES §48.4)._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Abrir o actualizar el issue del hueco de dinero
        if: steps.check.outputs.gap == 'yes'
        continue-on-error: true      # si Issues está deshabilitado, no tapa el rojo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create release-blocker --color B60205 \
            --description "Impide declarar el release" 2>/dev/null || true

          {
            echo "## El release sigue detenido por lo mismo"
            echo ""
            echo "Los tres flujos de dinero — **comprar**, **comprar como invitado** y"
            echo "**retirar/enviar** — no se han ejecutado NUNCA contra un backend real."
            echo "Se saltan en cada corrida de \`e2e-real.yml\` porque faltan los secrets de"
            echo "prueba de Stripe. Saltarlos es lo correcto (un job vacío en verde sería"
            echo "un falso verde, DEVOPS_NOTES §33.2); lo que no se puede es leer esos runs"
            echo "verdes como si el dinero estuviera probado."
            echo ""
            echo "### Qué hace falta (2 minutos, y solo lo puede hacer el dueño del repo)"
            echo ""
            echo "*Settings > Secrets and variables > Actions > New repository secret*:"
            echo ""
            echo "| secret | valor |"
            echo "|---|---|"
            echo "| \`STRIPE_TEST_SECRET_KEY\` | \`sk_test_…\` (Stripe > Developers > API keys, modo **test**) |"
            echo "| \`STRIPE_TEST_PUBLISHABLE_KEY\` | \`pk_test_…\` (la misma pantalla) |"
            echo ""
            echo "⛔ Nunca una clave \`sk_live_…\`: el preflight aborta y con razón."
            echo "No hay ninguna bandera que quitar además de esto."
            echo ""
            echo "### Y después"
            echo ""
            echo "1. Lanzar [\`e2e-real.yml\`](${E2E_URL}) con \`require_real_stripe = true\`."
            echo "2. Citar ese run en el veredicto de release (condición explícita de QA)."
            echo ""
            echo "### Si la respuesta es NO"
            echo ""
            echo "Es una decisión legítima, pero tiene que quedar escrita: registrar en"
            echo "\`docs/TECH_DEBT.md\` que los tres flujos de dinero se promueven SIN"
            echo "haberse ejecutado nunca, con esa firma. Este issue se cierra entonces a"
            echo "mano y se borra \`.github/workflows/money-gap-nag.yml\`."
            echo ""
            echo "---"
            echo "- Último run de esta comprobación: ${RUN_URL}"
            echo "- Detalle técnico: \`docs/DEVOPS_NOTES.md\` §31.1, §33.2, §46.4, §46.5, §48.4"
            echo "- **Dueño de la acción: el humano dueño del repositorio.** devops ya dejó"
            echo "  el cable puesto y probado; no hay nada más que un rol pueda hacer aquí."
          } > issue-body.md

          EXISTING="$(gh issue list --state open --limit 50 \
            --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")"

          if [ -n "${EXISTING}" ]; then
            echo "Issue #${EXISTING} ya abierto: se añade comentario."
            gh issue comment "${EXISTING}" --body-file issue-body.md
          else
            gh issue create --title "${TITLE}" --body-file issue-body.md --label release-blocker
          fi

      # ---------------------------------------------------------------------
      # NO HAY HUECO: el candado se apaga SOLO. Sin banderas que recordar.
      # ---------------------------------------------------------------------
      - name: Cerrar el issue si los secrets ya existen
        if: steps.check.outputs.gap == 'no'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "### Los dos secrets ya existen"
            echo ""
            echo "Este recordatorio se apaga solo. Falta el paso que SÍ mide:"
            echo "lanzar [\`e2e-real.yml\`](${E2E_URL}) con \`require_real_stripe = true\`"
            echo "y citar ese run en el veredicto de release."
            echo ""
            echo "Ojo: que la clave EXISTA no significa que sirva. Quien lo dice es el"
            echo "preflight del propio \`e2e-real.yml\`, que distingue ausente / formato"
            echo "raro / live. Si el run sale con \`money_gate=off\`, sigue sin medirse."
            echo ""
            echo "Comprobación: ${RUN_URL}"
          } > close-body.md
          EXISTING="$(gh issue list --state open --limit 50 \
            --json number,title \
            --jq "map(select(.title == \"${TITLE}\")) | .[0].number // empty")"
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body-file close-body.md
            gh issue close "${EXISTING}" --reason completed
          fi
          {
            echo ""
            echo "## Secrets presentes"
            echo ""
            echo "Queda el paso que mide: \`e2e-real.yml\` con \`require_real_stripe = true\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # El rojo, al final, para que la visibilidad ya haya corrido.
      - name: Marcar el run en rojo mientras el dinero siga sin medirse
        if: steps.check.outputs.gap == 'yes'
        run: |
          echo "::error title=Comprar / invitado / retirar SIN EJECUTAR::Faltan STRIPE_TEST_SECRET_KEY y/o STRIPE_TEST_PUBLISHABLE_KEY. Los tres flujos de dinero no se han probado nunca y el release está detenido por eso. Acción: el dueño del repo crea los dos secrets (claves de PRUEBA). Ver el issue con label 'release-blocker'."
          exit 1
