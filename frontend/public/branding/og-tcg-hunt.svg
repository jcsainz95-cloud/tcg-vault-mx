    <text x="240" y="278" text-anchor="middle" font-family="Montserrat, Archivo, system-ui, sans-serif" font-size="66" font-weight="700" letter-spacing="9" fill="url(#ogHuntGradWm)">TCG HUNT</text>
    <text x="452" y="312" text-anchor="end" font-family="Montserrat, Archivo, system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="0.5" fill="#4A0D0D">.mx</text>
  </g>
  <text x="1140" y="586" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="24" fill="#6E695E">tcghunt.mx</text>
