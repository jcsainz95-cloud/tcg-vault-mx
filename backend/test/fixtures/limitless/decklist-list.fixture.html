<!--
  ⚠️ FIXTURE SINTÉTICO — NO es una captura real de limitlesstcg.com/decks/list/<id>.
  DECKS-META Fase 2, supuesto A1 (spec §2.3): NO existe fixture capturado de la página de lista
  completa, así que su estructura es DOCUMENTADA, no verificada. Este archivo reproduce la estructura
  documentada (`.decklist-card[data-set][data-number][data-lang]` + `span.card-count` +
  `span.card-name`, columnas «Pokémon (N) / Trainer (N) / Energy (N)», energía básica con
  `data-basic-energy`) para que los unitarios del parser tengan algo determinista contra qué correr.
  El DRY-RUN en prod (§8) es lo que VALIDA/AJUSTA estos selectores contra la realidad.

  Suma de cantidades = 60 (14 Pokémon + 32 Trainer + 14 Energy). Incluye un Trainer cuyo nombre
  EMPIEZA por «Energy» (Energy Search) para probar que un `card-name` no se confunde con un
  encabezado de sección (defensa del parser).
-->
<!DOCTYPE html>
<html lang="en">
<head><title>Decklist</title></head>
<body>
  <div class="decklist">
    <div class="decklist-column">
      <div class="decklist-title heading">Pokémon (14)</div>

      </div>
      <div class="decklist-card" data-set="TWM" data-number="129" data-lang="EN">

      </div>

    </div>

    <div class="decklist-column">
