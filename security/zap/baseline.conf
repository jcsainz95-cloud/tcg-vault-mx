10202	WARN	(Ausencia de tokens Anti-CSRF)
#       ↑ RECLASIFICADA de FAIL a WARN (P-77). Motivo: esta app autentica con
#       **JWT Bearer**, no con sesión por cookie, así que un token anti-CSRF no
#       es la defensa que le toca y la regla marcaría TODOS los formularios como
#       bloqueantes. Dejarla en FAIL era garantizar un rojo permanente por diseño
#       — y un rojo que sale siempre no es una alarma, es ruido (la lección de
#       §33.2). Si alguna vez se introduce sesión por cookie, vuelve a FAIL.
10035	WARN	(Strict-Transport-Security)
#       ↑ Contra el stack efímero NO puede dispararse (el blanco es HTTP en
#       localhost). Se deja en WARN, no en IGNORE, porque sí es relevante en la
#       prueba puntual autorizada contra prod (§14.3), donde el blanco sí es HTTPS.


