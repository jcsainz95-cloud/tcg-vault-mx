# =============================================================================
# baseline.conf — Config de reglas para OWASP ZAP baseline/full  ·  devops
# =============================================================================
# Formato de zap-baseline.py / zap-full-scan.py (-c <config>):
#   <ruleId>\t<action>\t(<comentario opcional>)
# action: WARN | FAIL | IGNORE
#
# Política de gate (para CI/promoción a prod):
#   - FAIL: hallazgos que BLOQUEAN la promoción a producción (críticos/altos).
#   - WARN: se reportan pero no bloquean (revisar en SECURITY_NOTES).
#   - IGNORE: falsos positivos conocidos para ESTE stack (Next.js/NestJS).
#
# La lista de reglas es de referencia; ajústala tras el primer barrido real.
# La metodología de ataque vive en docs/PENTEST_NOTES.md (pentester); aquí solo
# está la CONFIG de infraestructura del escáner.
# =============================================================================

