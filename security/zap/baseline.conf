# =============================================================================
# baseline.conf — Política de reglas de ZAP  ·  devops
# =============================================================================
# Formato de zap-baseline.py / zap-full-scan.py (-c <config>):
#   <ruleId>\t<action>\t(<comentario>)
# action: FAIL | WARN | IGNORE
#
# ⚠️ ESTE ARCHIVO ES LA **ÚNICA** FUENTE DE POLÍTICA. Lo consume ZAP con `-c`, y
#    lo vuelve a leer `security/scripts/dast-gate.py` para decidir el veredicto.
#    No hay una segunda lista en ningún YAML.
#
#   FAIL   -> BLOQUEA el barrido (rojo). Sale arriba del informe con URL de ejemplo.
#   WARN   -> se reporta agregado (una línea por regla), no bloquea.
#   IGNORE -> NO sale en el informe. Se CUENTA en una línea al pie: "silenciado"
#             nunca puede volverse "invisible".
#   (no listada) -> WARN. Nunca FAIL: una firma nueva de ZAP no puede poner rojo
#             un gate por sorpresa; se ve, y se clasifica aquí a mano.
#
# ---------------------------------------------------------------------------
# CALIBRADO CON EVIDENCIA, NO POR ADELANTADO (P-77, 2026-09-10)
# ---------------------------------------------------------------------------
# La versión anterior de este archivo decía "la lista es de referencia; ajústala
# tras el primer barrido real". Ese primer barrido nunca ocurrió: el DAST apuntaba
# a un staging inexistente y salía en verde sin escanear. Así que la política
# llevaba meses sin haber visto un solo hallazgo.
#
# Ya hay barrido. Todo lo de abajo está clasificado contra DOS mediciones reales
# del run `34437760891`:
#   · el STACK REAL (vitrina Next.js + API NestJS, ZAP full + araña AJAX): 23
#     reglas con hallazgos, CERO bloqueantes.
#   · el CANARIO con vulnerabilidades PLANTADAS (dast-selftest): disparó
#     40012, 6 y 90022 como FAIL ⇒ gate ROJO. La política DISCRIMINA: no es
#     verde-siempre ni rojo-siempre, y eso está medido, no supuesto.
#
# EL RUIDO ES EL COSTE REAL. Un informe semanal de 23 líneas que nadie revisa se
# ignora en un mes, y entonces el verde no protege. Se prefiere un informe corto
# y creíble a uno exhaustivo que nadie lea. Cada IGNORE de abajo lleva su motivo;
# si no se puede escribir el motivo, no se silencia.
#
# ⚠️ AL LEER LOS HALLAZGOS DE CABECERAS: el blanco es un stack EFÍMERO en
#    `http://localhost` — sin CDN, sin WAF, sin TLS, sin la config de Vercel o
#    Railway. Todo lo que ZAP diga sobre TLS/borde describe a localhost, NO a
#    `tcghunt.mx`. Alcance declarado: docs/DEVOPS_NOTES.md §44.4.
# =============================================================================


# =============================================================================
