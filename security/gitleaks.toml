# =============================================================================
# gitleaks.toml — Detección de secretos  ·  Propiedad: devops
# =============================================================================
# Extiende el ruleset base de gitleaks y añade reglas/allowlist propias del
# proyecto (claves de Stripe, tokens de APIs de precio, Banxico SIE, JWT).
#
# Local:  ./security/scripts/sast-gitleaks.sh
# CI:     .github/workflows/security-sast.yml  (job "gitleaks")
#
# Objetivo: que NUNCA se comitee un secreto real. Los placeholders de
# .env.example (CHANGE_ME, *_dummy, sk_test_) están en la allowlist.
# =============================================================================

title = "TCG Marketplace gitleaks config"

# Hereda todas las reglas por defecto de gitleaks (AWS, GCP, GitHub, etc.).
[extend]
useDefault = true

# --- Reglas específicas del proyecto -----------------------------------------

[[rules]]
id = "stripe-live-secret-key"
description = "Stripe live secret key"
regex = '''sk_live_[0-9a-zA-Z]{24,}'''
keywords = ["sk_live_"]

[[rules]]
id = "stripe-live-restricted-key"
description = "Stripe live restricted key"
regex = '''rk_live_[0-9a-zA-Z]{24,}'''
keywords = ["rk_live_"]

[[rules]]
id = "stripe-webhook-secret"
description = "Stripe webhook signing secret"
regex = '''whsec_[0-9a-zA-Z]{24,}'''
keywords = ["whsec_"]

[[rules]]
id = "jwt-hex-secret"
description = "Posible JWT secret hex de 48+ bytes asignado en código"
regex = '''(?i)(jwt_access_secret|jwt_refresh_secret)\s*[:=]\s*['"][0-9a-f]{64,}['"]'''
keywords = ["jwt_access_secret", "jwt_refresh_secret"]

[[rules]]
id = "banxico-sie-token"
description = "Token de la API SIE de Banxico (64 hex)"
regex = '''(?i)banxico_sie_token\s*[:=]\s*['"][0-9a-f]{64}['"]'''
keywords = ["banxico_sie_token"]

[[rules]]
id = "generic-api-key-assignment"
description = "Asignación de API key genérica en código"
regex = '''(?i)(pokemontcg_io_api_key|pokemonpricetracker_api_key|poketrace_api_key)\s*[:=]\s*['"][0-9a-zA-Z_\-]{16,}['"]'''
keywords = ["api_key"]
# Esta regla captura como «secreto» el NOMBRE de la clave (grupo 1), así que
# la allowlist GLOBAL (que mira el secreto) no puede eximirla por valor. La
# excepción del historial (§56.3, commit 46d76cc: mock `SUPER-SECRETO-123` en
# backend/test/graded-estimate.ingest.spec.ts) va aquí, acotada a ESTA regla y
# a ESE literal, mirando la línea completa (`regexTarget = "match"`).
[rules.allowlist]
regexTarget = "match"
regexes = [
  '''POKEMONPRICETRACKER_API_KEY:\s*'SUPER-SECRETO-123'''',
]

# --- Allowlist: placeholders y valores de prueba NO son hallazgos ------------
[allowlist]
description = "Placeholders de .env.example, dummies de CI y claves de TEST"
regexes = [
  '''CHANGE_ME''',
  '''_dummy''',
  '''_change_me''',
  # S-GL-1 / C4 (seguridad, 2026-09-11): antes decía `sk_test_[0-9a-zA-Z_]*`,
  # que —sin anclas y con `*`— casaba CUALQUIER `sk_test_…`, incluida la clave
  # de prueba REAL de la tienda (`sk_test_51` + alfanumérico). Ahora solo pasa
  # un placeholder que se DELATA: sin un solo dígito (`sk_test_dummy`,
  # `sk_test_xxx…`, `sk_test_algo`) o con una palabra auto-delatora dentro
  # (`sk_test_e2e_dummy`, `sk_test_CHANGE_ME`). Una clave real siempre lleva
  # dígitos y nunca lleva esas palabras. Anclado (`^…$`) sobre el secreto.
  # Lo demuestra security/scripts/sast-gitleaks-canary.sh.
  '''^(sk|pk|rk)_test_(?:[A-Za-z_]+|[A-Za-z0-9_]*(?:dummy|DUMMY|CHANGE_ME|change_me|placeholder|PLACEHOLDER)[A-Za-z0-9_]*)$''',
  '''whsec_(ci|staging|test)_''',
  '''minioadmin''',
  '''tcg_local_dev_password''',
  '''tcg_staging_password''',
  '''ChangeMe123!''',
  '''StagingAdmin123!''',
  '''Operador123!''',
  # HISTORIAL de `backend/` (§56.3; backend los neutralizó en el árbol en
  # a454178, pero `gitleaks git .` sigue viendo los commits viejos fbb66e1,
  # 46d76cc y e504466). Los tres son FICCIÓN de tests o un falso positivo, y
  # por eso se permiten POR VALOR EXACTO (anclado), no por ruta ni por commit:
  #   · `SUPER-SECRETO-123`  → POKEMONPRICETRACKER_API_KEY de un spec (mock);
  #                             su regla expone el NOMBRE como secreto, así que
  #                             va en `[rules.allowlist]` de esa regla, no aquí.
  #   · `A-Strong-Secret-123` → SEED_ADMIN_PASSWORD de un spec (mock).
  #   · `asB64.length`       → un trozo de código (`const key = asB64.length`),
  #                             no un valor: falso positivo de generic-api-key.
  # Medido tras añadirlos: `gitleaks git .` (historial completo) 0 hallazgos.
  # CI escanea el RANGO del push (security-sast.yml), así que estos nunca
  # ponían rojo un run: esto deja limpio el modo `git` manual/local.
  '''^A-Strong-Secret-123$''',
  '''^asB64\.length$''',
  # Skydropx C-TL-1 (2026-10-05): `tok-de-prueba-123` es el token FICTICIO de
  # la URL de seguimiento en backend/test/sdx-tl31af.units.spec.ts:193
  # (commit 0b630899; `...pedido?token=tok-de-prueba-123`). generic-api-key lo
  # ve como secreto por el nombre `token=`. Se permite por VALOR EXACTO anclado
  # (como `A-Strong-Secret-123`), sin patron amplio: cualquier otro `token=...`
  # sigue siendo rojo.
  '''^tok-de-prueba-123$''',
  # PR #70 (claude/staff-sin-correo, 2026-10-04): contraseñas de FICCIÓN en
  # pruebas de integración de backend; CI (rango de la PR) las marcaba como
  # generic-api-key. Medido: solo aparecen en esas specs, en ningún .env ni
  # workflow. Por VALOR EXACTO (anclado), no por ruta:
  #   · `Otra-STF-98765`  → newPassword de STF-17 en
  #       backend/test/integration/staff-without-email.e2e-spec.ts (0a42d85a).
  #   · `Rescate-STF34-`  → prefijo literal de NEW_ADMIN_PASSWORD (se le
  #       concatena un randomUUID) en
  #       backend/test/integration/stf-errata-v1-80-9-1.e2e-spec.ts (1d946722).
  '''^Otra-STF-98765$''',
  '''^Rescate-STF34-$''',
  # Skydropx (2026-10-05): `operator_label_cap_24h_cents` es el NOMBRE de un
  # dial de settings (no un secreto) usado como `key: '...'` en
  # backend/test/integration/sdx-d2g-owner.e2e-spec.ts:97 (55b82ecb) y
  # backend/test/sdx-d.dials.spec.ts:78 (62f89781); generic-api-key lo marcaba
  # por el nombre `key:`. Por VALOR EXACTO (anclado), sin patron amplio.
  '''^operator_label_cap_24h_cents$''',
  # claude/listo-real (2026-10-05): secretos JWT de FICCIÓN en una prueba
  # unitaria de backend; CI (rango de la rama) los marcaba como generic-api-key.
  # Medido: solo aparecen en backend/test/auth.session-max-age.spec.ts (6a227527),
  # en ningún .env ni workflow; su sufijo es el alfabeto hex en orden. Por VALOR
  # EXACTO (anclado), no por ruta:
  #   · `ref-secret-ses-0123…`  → REFRESH_SECRET (línea 33 en 241d4dca).
  #   · `acc-secret-ses-0123…`  → JWT_ACCESS_SECRET (línea 39 en 241d4dca).
  '''^ref-secret-ses-0123456789abcdef0123456789$''',
  '''^acc-secret-ses-0123456789abcdef0123456789$''',
  # Ruido de `gitleaks dir .` (seguridad, veredicto listo-real 2026-10-05,
  # §3.1 «Ruido aparte»): tres valores de FICCIÓN en specs de backend que el
  # escaneo del árbol completo marcaba como generic-api-key (CI no, porque
  # escanea el rango). Medido con 8.30.1: solo aparecen en esos specs. Por VALOR
  # EXACTO (anclado), no por ruta:
  #   · `ref-secret-rt-0123…`  → backend/test/auth.refresh-typ.spec.ts:27.
  #   · `otra-clave-123`       → backend/test/auth.c7-policy.spec.ts:466.
  #   · `bk-p79-legacy`        → backend/test/inventory.sealed-product-alta.spec.ts:521.
  '''^ref-secret-rt-0123456789abcdef0123456789$''',
  '''^otra-clave-123$''',
  '''^bk-p79-legacy$''',
  # P-GL-2 / CL-2 (2026-10-05): al retirar la exención POR RUTA de `docs/*.md`,
  # `security/*` y `docker-compose*.yml` (ver `paths` abajo), el escaneo de
  # 8.30.1 sobre el historial COMPLETO (`gitleaks git .`, 2255 commits) da
  # exactamente 5 hallazgos nuevos, los cinco en `docs/` y los cinco ficción o
  # no-secretos. Se eximen POR VALOR EXACTO (anclado):
  #   · `sk_live_51ClaveRealDelDueno` → ficción de canario citada en
  #       docs/SECURITY_NOTES.md (19 caracteres: no tiene forma de clave real;
  #       cualquier otra `sk_live_…` sigue siendo roja).
  #   · `ppt_live_ABC123`             → ejemplo en docs/DEVOPS_NOTES.md.
  #   · `re_AbCd123456`               → ejemplo en el historial de DEVOPS_NOTES.md (3a44fb73).
  #   · `E2E_ENABLE_THROTTLER=true`   → nombre de un dial, docs/BACKEND_NOTES.md.
  #   · `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9` → la cabecera JWT pública
  #       `{"alg":"HS256","typ":"JWT"}` en base64, docs/specs/SKYDROPX_API_REFERENCIA.md.
  '''^sk_live_51ClaveRealDelDueno$''',
  '''^ppt_live_ABC123$''',
  '''^re_AbCd123456$''',
  '''^E2E_ENABLE_THROTTLER=true$''',
  '''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9$''',
]
paths = [
  '''\.env\.example$''',
  # P-GL-FP (2026-09-11): los dos canarios PLANTAN secretos falsos por
  # construcción (una `sk_live_`, un `whsec_`, una `sk_test_51…` de ficción)
  # para exigir que los candados muerdan. Run rojo de referencia: 34554095125
  # (9 hallazgos, todos en estos dos ficheros). Se permiten POR RUTA —no
  # ensanchando ninguna regex—: cualquier otro fichero con el mismo contenido
  # sigue siendo rojo (el canario lo comprueba copiándolo a otra ruta).
  '''^scripts/check-secret-defaults-canary\.sh$''',
  '''^scripts/check-stripe-webhook-failclosed-canary\.sh$''',
  # P-GL-2 / CL-2 (seguridad, 2026-09-11 y re-medido 2026-10-05): aquí había
  # tres exenciones POR RUTA, desde el commit de arranque (ec8b9595), no por
  # ruido medido: `(^|/)docs/.*\.md$`, `security/.*\.(md|toml|yml|yaml)$` y
  # `docker-compose.*\.yml$`. Con ellas, una `sk_live_`/`rk_live_`/`whsec_`
  # real escrita en una guía de `docs/` (donde los agentes escriben guías y
  # traspasos, en un repo PÚBLICO) pasaba en verde: seguridad plantó en 5
  # sitios y gitleaks vio 2/5. RETIRADAS. Su coste medido: 5 valores de
  # ficción en todo el historial, eximidos por valor arriba. El canario
  # (security/scripts/sast-gitleaks-canary.sh, bloque P-GL-2) planta en los
  # 5 sitios y exige 5/5; con cualquiera de las tres rutas de vuelta sale rojo.
  # Si un doc futuro da un falso positivo: se exime ESE VALOR, anclado. Nunca
  # la ruta.
  # F1-4 (techlead, 2026-09-11): aquí estaba `\.github/workflows/.*\.yml$`, que
  # eximía los workflows ENTEROS. Retirada: medido con el mismo binario
  # (v8.30.1) sobre `gitleaks dir .` y `gitleaks git .` (historial completo)
  # con y sin la línea, el conjunto de hallazgos es IDÉNTICO (0 en
  # .github/workflows/ en ambos modos). La exención no evitaba ningún falso
  # positivo: solo abría un hueco. Control compensatorio que sigue vigente y
  # cubre lo que gitleaks no ve (respaldos `${{ secrets.X || 'literal' }}` y
  # literales en claves con nombre de secreto): scripts/check-secret-defaults.sh
  # bloque (B). Si un workflow futuro dispara un falso positivo, se exime ESA
  # regla o ESA ruta con motivo, no la carpeta.
]
