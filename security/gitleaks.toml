# =============================================================================
# gitleaks.toml — Detección de secretos  ·  Propiedad: devops
# =============================================================================
# Extiende el ruleset base de gitleaks y añade reglas/allowlist propias del
# proyecto (claves de Stripe, tokens de APIs de precio, Banxico SIE, JWT).
#
# Local:  ./security/scripts/sast-gitleaks.sh
# CI:     .github/workflows/security-sast.yml  (job "gitleaks")
#
# Objetivo: que NUNCA se comitee un secreto real. Los placeholders de
# .env.example (CHANGE_ME, *_dummy, sk_test_) están en la allowlist.
# =============================================================================

title = "TCG Marketplace gitleaks config"

# Hereda todas las reglas por defecto de gitleaks (AWS, GCP, GitHub, etc.).
[extend]
useDefault = true

# --- Reglas específicas del proyecto -----------------------------------------

[[rules]]
id = "stripe-live-secret-key"
description = "Stripe live secret key"
regex = '''sk_live_[0-9a-zA-Z]{24,}'''
keywords = ["sk_live_"]

[[rules]]
id = "stripe-live-restricted-key"
description = "Stripe live restricted key"
regex = '''rk_live_[0-9a-zA-Z]{24,}'''
keywords = ["rk_live_"]

[[rules]]
id = "stripe-webhook-secret"
description = "Stripe webhook signing secret"
regex = '''whsec_[0-9a-zA-Z]{24,}'''
keywords = ["whsec_"]

[[rules]]
id = "jwt-hex-secret"
description = "Posible JWT secret hex de 48+ bytes asignado en código"
regex = '''(?i)(jwt_access_secret|jwt_refresh_secret)\s*[:=]\s*['"][0-9a-f]{64,}['"]'''
keywords = ["jwt_access_secret", "jwt_refresh_secret"]

[[rules]]
id = "banxico-sie-token"
description = "Token de la API SIE de Banxico (64 hex)"
regex = '''(?i)banxico_sie_token\s*[:=]\s*['"][0-9a-f]{64}['"]'''
keywords = ["banxico_sie_token"]

[[rules]]
id = "generic-api-key-assignment"
description = "Asignación de API key genérica en código"
regex = '''(?i)(pokemontcg_io_api_key|pokemonpricetracker_api_key|poketrace_api_key)\s*[:=]\s*['"][0-9a-zA-Z_\-]{16,}['"]'''
keywords = ["api_key"]

# --- Allowlist: placeholders y valores de prueba NO son hallazgos ------------
[allowlist]
description = "Placeholders de .env.example, dummies de CI y claves de TEST"
regexes = [
  '''CHANGE_ME''',
  '''_dummy''',
  '''_change_me''',
  # S-GL-1 / C4 (seguridad, 2026-09-11): antes decía `sk_test_[0-9a-zA-Z_]*`,
  # que —sin anclas y con `*`— casaba CUALQUIER `sk_test_…`, incluida la clave
  # de prueba REAL de la tienda (`sk_test_51` + alfanumérico). Ahora solo pasa
  # un placeholder que se DELATA: sin un solo dígito (`sk_test_dummy`,
  # `sk_test_xxx…`, `sk_test_algo`) o con una palabra auto-delatora dentro
  # (`sk_test_e2e_dummy`, `sk_test_CHANGE_ME`). Una clave real siempre lleva
  # dígitos y nunca lleva esas palabras. Anclado (`^…$`) sobre el secreto.
  # Lo demuestra security/scripts/sast-gitleaks-canary.sh.
  '''^(sk|pk|rk)_test_(?:[A-Za-z_]+|[A-Za-z0-9_]*(?:dummy|DUMMY|CHANGE_ME|change_me|placeholder|PLACEHOLDER)[A-Za-z0-9_]*)$''',
  '''whsec_(ci|staging|test)_''',
  '''minioadmin''',
  '''tcg_local_dev_password''',
  '''tcg_staging_password''',
  '''ChangeMe123!''',
  '''StagingAdmin123!''',
  '''Operador123!''',
]
paths = [
  '''\.env\.example$''',
  # P-GL-FP (2026-09-11): los dos canarios PLANTAN secretos falsos por
  # construcción (una `sk_live_`, un `whsec_`, una `sk_test_51…` de ficción)
  # para exigir que los candados muerdan. Run rojo de referencia: 34554095125
  # (9 hallazgos, todos en estos dos ficheros). Se permiten POR RUTA —no
  # ensanchando ninguna regex—: cualquier otro fichero con el mismo contenido
  # sigue siendo rojo (el canario lo comprueba copiándolo a otra ruta).
  '''^scripts/check-secret-defaults-canary\.sh$''',
  '''^scripts/check-stripe-webhook-failclosed-canary\.sh$''',
  '''(^|/)docs/.*\.md$''',
  '''security/.*\.(md|toml|yml|yaml)$''',
  '''docker-compose.*\.yml$''',
  # F1-4 (techlead, 2026-09-11): aquí estaba `\.github/workflows/.*\.yml$`, que
  # eximía los workflows ENTEROS. Retirada: medido con el mismo binario
  # (v8.30.1) sobre `gitleaks dir .` y `gitleaks git .` (historial completo)
  # con y sin la línea, el conjunto de hallazgos es IDÉNTICO (0 en
  # .github/workflows/ en ambos modos). La exención no evitaba ningún falso
  # positivo: solo abría un hueco. Control compensatorio que sigue vigente y
  # cubre lo que gitleaks no ve (respaldos `${{ secrets.X || 'literal' }}` y
  # literales en claves con nombre de secreto): scripts/check-secret-defaults.sh
  # bloque (B). Si un workflow futuro dispara un falso positivo, se exime ESA
  # regla o ESA ruta con motivo, no la carpeta.
]
