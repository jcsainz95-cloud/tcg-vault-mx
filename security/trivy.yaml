# =============================================================================
# trivy.yaml — Configuración de Trivy  ·  Propiedad: devops
# =============================================================================
# Escaneo de vulnerabilidades de dependencias (filesystem) e imágenes Docker.
# Lo consumen security/scripts/trivy-fs.sh, trivy-fs-selftest.sh,
# trivy-dev-fichas.sh, trivy-image.sh y —a través de trivy-fs.sh— CI.
#
# Política de gate: FALLA en HIGH y CRITICAL (severity abajo + exit-code 1 en
# el wrapper/CI). Los vuln sin fix disponible NO se toleran (ignore-unfixed
# false en el wrapper): se reportan todos.
#
# ESQUEMA (corregido 2026-09-11, S-SAST-1 — DEVOPS_NOTES §53): la versión
# anterior de este fichero tenía `scanners:` y `skip-dirs:` en el nivel raíz y
# `vulnerability.type`. Trivy NO lee esas claves ahí (avisa «deprecated» de la
# última y calla con las otras), así que la restricción a `vuln` que este
# fichero declaraba desde el día uno NUNCA estuvo en vigor: el escáner de
# SECRETOS de trivy —que va encendido por defecto en `trivy fs`— corrió en cada
# PR sin que nadie lo hubiera decidido, y puso el gate en rojo 11 corridas por
# cinco `sk_test_…` de ficción en dos canarios. Las claves de abajo son las del
# esquema real (`trivy config` / docs «Config file»). El wrapper pasa además
# `--scanners vuln` por línea de comandos, porque un esquema que ya derivó una
# vez puede volver a derivar y el alcance del gate no puede depender de eso.
# =============================================================================

scan:
  # SOLO vulnerabilidades. Los secretos los cubre gitleaks (security/gitleaks.toml,
  # con la allowlist de placeholders `sk_test_…`/`CHANGE_ME`/`*_dummy`): un hecho,
  # un escáner, un criterio. Dos escáneres de secretos con dos allowlists es
  # exactamente el defecto que S-SAST-1 midió.
  scanners:
    - vuln
  # Rutas ignoradas en el escaneo de filesystem (artefactos que no van a prod).
  skip-dirs:
    - "**/node_modules/.cache"
    - "**/.next/cache"
    - "**/coverage"
    - "**/dist/tmp"

severity:
  - HIGH
  - CRITICAL

# Formato por defecto (el wrapper puede sobreescribir a sarif/json en CI).
format: table

# No fallar por errores de descarga de la DB en entornos sin red: el wrapper
# controla el exit-code real del gate.
exit-code: 0

pkg:
  # Solo vulnerabilidades ya divulgadas y con estado relevante.
  types:
    - os
    - library
